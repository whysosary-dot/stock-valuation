<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chart — 시장 그룹판 · 아이디어 포착기</title>
<link rel="stylesheet" href="https://whysosary-dot.github.io/stock-valuation/theme.css">
<style>
/* 시장 그룹판(일·주·월 추세) + 일봉·주봉 스캔. 데이터: chart/data/*.json (GitHub Actions 가 매일 생성) */
body{padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:16px;font-weight:800;margin:0}
.top .meta{font-size:12px;color:var(--text-dim)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tab{border:1px solid var(--border-strong);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.chip{border:1px solid var(--border-strong);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip .n{color:var(--text-dim);font-weight:500;margin-left:3px}
.tip{font-size:12px;color:var(--text-dim);margin:0 0 10px;line-height:1.6}
.tip b{color:var(--text)}
.sec-h{font-size:14px;font-weight:800;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}
.sec-h .s{font-size:12px;color:var(--text-dim);font-weight:500}
/* 그룹 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.gcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px 8px;box-shadow:var(--shadow);min-width:0}
.gcard.hot{border-color:#c2410c}
.gcard .h{display:flex;align-items:baseline;gap:6px}
.gcard .nm{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .sb{font-size:11px;color:var(--text-dim);white-space:nowrap}
.gcard .chg{margin-left:auto;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.gcard canvas{width:100%;height:92px;display:block;margin:4px 0 2px}
.gcard .f{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
.bd{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border-strong);border-radius:5px;padding:0 5px;font-size:11px;font-weight:700;line-height:18px;color:var(--text-dim)}
.bd.up{color:var(--up);border-color:#f3c3c9;background:#fdeef0}
.bd.dn{color:var(--down);border-color:#c7d2fb;background:#edf1fe}
.bd.flip{outline:2px solid #c2410c;outline-offset:-1px}
/* 와인스타인 4단계 */
.stg{display:inline-flex;align-items:center;border-radius:5px;padding:0 7px;font-size:11px;font-weight:700;line-height:19px;white-space:nowrap}
.stg.s1{background:#e5e7eb;color:#374151}.stg.s2{background:#fde2e2;color:#b91c1c}.stg.s3{background:#f6dfae;color:#92400e}.stg.s4{background:#d9e2f5;color:#1e40af}
.stg.flip{outline:2px solid #c2410c;outline-offset:-1px}
.gcard .h2{display:flex;align-items:center;gap:6px;margin-top:4px;min-height:19px}
.ssum{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.7;margin:0 0 10px;box-shadow:var(--shadow)}
.sdist{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px 8px;margin:0 0 10px;box-shadow:var(--shadow)}
.sdist h3{font-size:13.5px;font-weight:800;margin:0 0 3px}.sdist .s{font-size:11.5px;color:var(--text-dim);margin:0 0 6px;line-height:1.5}
.sdist canvas{width:100%;height:190px;display:block}
.mt td .stg{line-height:17px;font-size:10.5px}
.up{color:var(--up)} .dn{color:var(--down)} .flat{color:var(--text-dim)}
/* 스캔 카드 */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px}
@media (max-width:520px){.sgrid{grid-template-columns:1fr}}
.scard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px 10px;box-shadow:var(--shadow);min-width:0}
.scard .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.scard .tk{font-weight:800;font-size:16px}
.scard .tk a{color:inherit;text-decoration:none}
.scard .nm{font-size:12.5px;color:var(--text-dim)}
.scard .px{margin-left:auto;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.scard .desc{font-size:12px;color:var(--text-dim);margin:2px 0 6px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px}
.tg{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid transparent}
.tg.k{background:#fdeef0;color:#b91c1c;border-color:#f3c3c9}
.tg.w{background:#eef7ee;color:#166534;border-color:#bfe3c6}
.tg.rs{background:#f3f0ff;color:#5b3fb5;border-color:#d9d0f7}
.tg.i{background:var(--panel-2);color:var(--text-dim);border-color:var(--border)}
.tg.e{background:#fff7e6;color:#9a5b00;border-color:#f3dfae}
.scard .news{font-size:12px;margin:0 0 6px;color:var(--text)}
.scard .news a{color:var(--accent)}
.tf{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;margin:2px 0 6px}
.tf button{border:0;background:var(--panel);padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text)}
.tf button.on{background:var(--text);color:#fff}
.scard canvas{width:100%;height:230px;display:block}
.scard .f{font-size:11.5px;color:var(--text-dim);margin-top:4px;line-height:1.6}
.scard .f b{color:var(--text);font-weight:600}
.empty{color:var(--text-dim);font-size:13px;padding:12px 4px}
.hist{margin-left:auto;font-size:12px}
.hist select{font-size:12px;padding:3px 6px;border:1px solid var(--border-strong);border-radius:6px;background:var(--panel)}
.legend{font-size:11px;color:var(--text-dim)}
/* 인사이트: 상단 💡 버튼 → 모달 (AI insights/chart.json + 데이터 요약 data/insights_auto.json) */
.ibtn{margin-left:auto;background:var(--panel);border:1px solid var(--border-strong);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.ibtn:hover{background:var(--panel-2);border-color:var(--accent);color:var(--accent)}
.ibtn.has{border-color:var(--accent)}
.ins{padding:0 8px 12px}
.ins .m{font-size:11.5px;color:var(--text-dim);margin:6px 0 2px}
.ins .m.stale{color:#b45309}
.ins .body{margin-top:4px}
.ichips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 6px;border-bottom:1px solid var(--border)}
.ins .head{font-size:14px;font-weight:800;margin:2px 0 8px;line-height:1.5}
.ins .ic{border-left:3px solid var(--border-strong);padding:4px 10px;margin:6px 0}
.ins .ic .t{font-weight:700;font-size:13px}
.ins .ic .b{font-size:12.5px;line-height:1.65;margin-top:2px}
.ins .tags{margin-top:3px}
.ins .tag{display:inline-block;font-size:10.5px;background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:0 6px;margin-right:4px;color:var(--text-dim)}
.ins ul{margin:4px 0 0 18px;padding:0;font-size:12.5px;line-height:1.6}
.ins .auto{margin-top:8px;border-top:1px dashed var(--border);padding-top:6px}
.ins .auto .lab{font-size:11.5px;font-weight:700;color:var(--text-dim);margin-bottom:2px}
.ins .auto li{font-size:12.3px;line-height:1.6;color:var(--text)}
.ins .src{font-size:11.5px;color:var(--text-dim);margin-top:6px}
.ins .src a{color:var(--accent)}
.ins .none{font-size:12px;color:var(--text-dim)}
/* 그룹 제목 클릭 → 구성종목 */
.gcard .nm.lk{cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.gcard .nm.lk:hover{color:var(--accent);text-decoration-color:var(--accent)}
.mb{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 10px;overflow:auto}
.md{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(860px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.md .hd{display:flex;align-items:baseline;gap:10px;padding:14px 16px 8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.md .hd h2{font-size:16px;margin:0;font-weight:800}
.md .hd .s{font-size:12px;color:var(--text-dim)}
.md .hd .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--text-dim);line-height:1}
.md .inds{padding:8px 16px;font-size:12px;color:var(--text-dim);line-height:1.7;border-bottom:1px solid var(--border)}
.md .inds b{color:var(--text)}
.md .bd2{overflow:auto;padding:0 8px 10px}
.mt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mt th{position:sticky;top:0;background:var(--panel);text-align:right;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--border-strong);cursor:pointer;white-space:nowrap;color:var(--text-dim)}
.mt th.on{color:var(--accent)}
.mt th:nth-child(1),.mt th:nth-child(2),.mt td:nth-child(1),.mt td:nth-child(2){text-align:left}
.mt td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.mt td a{color:inherit;text-decoration:none;font-weight:600}
.mt td a:hover{color:var(--accent)}
.mt .wbar{display:inline-block;height:8px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px;vertical-align:middle;margin-right:6px}
.mt .mk{font-size:10.5px;color:var(--text-dim);margin-left:4px}
</style>
</head>
<body>
<div class="top">
  <h1>📉 Chart — 시장 그룹판 · 아이디어 포착기</h1>
  <span class="meta" id="meta">불러오는 중…</span>
  <button class="ibtn" id="ins-btn" type="button" title="섹션별 AI 인사이트 + 데이터 요약">💡 인사이트</button>
</div>
<div class="tabs">
  <button class="tab on" data-v="board">시장 그룹판</button>
  <button class="tab" data-v="scan">스캔 (일봉·주봉)</button>
  <button class="tab" data-v="etf">ETF</button>
  <button class="tab" data-v="index">인덱스</button>
</div>

<div id="v-board">
  <div class="sub">
    <button class="chip on" data-b="kr">🇰🇷 한국 업종</button>
    <button class="chip" data-b="us">🇺🇸 미국 지수·섹터</button>
    <button class="chip" data-b="macro">🌐 상품·통화·금리</button>
  </div>
  <p class="tip" id="board-tip"></p>
  <div id="stage-sum" class="ssum" style="display:none"></div>
  <div id="stage-dist" class="sdist" style="display:none"><h3 id="sd-title"></h3><p class="s" id="sd-sub"></p><canvas id="sd-cv"></canvas></div>
  <div class="grid" id="board"></div>
</div>

<div id="v-index" style="display:none">
  <div id="index-native"><div class="ixn-load">지표 불러오는 중…</div></div>
</div>
<div id="v-etf" style="display:none">
  <div class="sub" id="etf-sub">
    <button class="chip on" data-c="">전체</button>
    <button class="chip" data-c="한국 ETF">한국 ETF</button>
    <button class="chip" data-c="섹터/테마">섹터·테마</button>
    <button class="chip" data-c="국가/지역">국가·지역</button>
    <button class="chip" data-c="크로스에셋">크로스에셋</button>
    <button class="chip" data-c="심리 지표">심리 지표</button>
    <span style="width:10px"></span>
    <select id="etf-sort" class="chip" style="padding:4px 8px"><option value="rel_3m">3개월 상대 순</option><option value="ret_1m">1개월 순</option><option value="chg">당일 순</option><option value="ret_2y">2년 순</option><option value="stage">단계 순 (1→4)</option><option value="name">이름 순</option></select>
    <input id="etf-q" class="chip" type="search" placeholder="🔍 이름·티커·섹터" style="min-width:160px">
    <a class="legend" href="https://whysosary-dot.github.io/etf-monitor/" target="_blank" rel="noopener" style="margin-left:auto">표 형식(ETF Monitor) ↗</a>
  </div>
  <p class="tip" id="etf-tip"></p>
  <div class="grid" id="etf-grid"></div>
</div>

<div id="v-scan" style="display:none">
  <div class="sub">
    <button class="chip on" data-m="kr">🇰🇷 한국</button>
    <button class="chip" data-m="us">🇺🇸 미국</button>
    <span style="width:10px"></span>
    <span id="tagchips"></span>
    <span class="hist">이력 <select id="hist"></select></span>
  </div>
  <p class="tip" id="scan-tip"></p>
  <div id="scan"></div>
</div>

<script>
const BASE = './data/';
const TAGS = {
  gap_up:      { l: '거래량 터진 갭 상승', c: 'k', d: '시가 갭 +3%↑ · 종가 +5%↑ · 거래량 50일 평균 3배↑ · 고가권(상위 40%) 마감' },
  new_high:    { l: '52주 신고가', c: 'k', d: '종가가 직전 52주 고가 돌파 · 거래량 1.2배↑' },
  ma200_break: { l: '200일선 돌파', c: 'k', d: '전일 200일선 아래 → 오늘 위 · +2%↑ · 거래량 1.5배↑' },
  rs_leader:   { l: 'RS 선두주 급등', c: 'rs', d: 'RS 90↑ · 50일선 위 · +3%↑ · 거래량 2배↑' },
  w_ma30_break:{ l: '주봉 · 30주선 돌파', c: 'w', d: '이번 주 종가가 30주선 상향 돌파 · 주간 거래량 10주 평균 1.5배↑' },
  w_vol_surge: { l: '주봉 · 거래량 급증 상승', c: 'w', d: '주간 +8%↑ · 주간 거래량 2.5배↑ · 주간 고가권 마감 · RS 60↑' },
};
const state = { view: 'board', board: 'kr', mkt: 'kr', tag: null, hist: '', data: {}, tf: {} };
const $ = s => document.querySelector(s);
const fmtPct = (v, d = 1) => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(d) + '%';
const cls = v => v == null ? 'flat' : v > 0.0001 ? 'up' : v < -0.0001 ? 'dn' : 'flat';
const fmtN = (v, mkt) => v == null ? '—' : mkt === 'US' ? ('$' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 })) : Number(v).toLocaleString('ko-KR') + '원';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function jget(p) { const r = await fetch(BASE + p + '?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' }); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }
const dpr = () => Math.min(2, window.devicePixelRatio || 1);
function setupCanvas(cv) { const w = cv.clientWidth || 300, h = cv.clientHeight || 100; cv.width = Math.round(w * dpr()); cv.height = Math.round(h * dpr()); const g = cv.getContext('2d'); g.setTransform(dpr(), 0, 0, dpr(), 0, 0); return [g, w, h]; }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ── 그룹 카드 미니차트: 2년 주봉 종가 + 30주선 ── */
function drawGroup(cv, c) {
  const [g, w, h] = setupCanvas(cv);
  const xs = c.w_close, ma = c.w_ma30; const n = xs.length; if (n < 2) return;
  const padT = 6, padB = 16, padR = 44, padL = 2;
  const vals = xs.concat(ma.filter(x => x != null)); let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) hi = lo + 1;
  const X = i => padL + (w - padL - padR) * i / (n - 1), Y = v => padT + (h - padT - padB) * (1 - (v - lo) / (hi - lo));
  if (c.w_stage && c.w_stage.length === n) {
    let i0 = 0;
    for (let i = 1; i <= n; i++) {
      if (i === n || c.w_stage[i] !== c.w_stage[i0]) {
        const st = c.w_stage[i0];
        if (st) { g.fillStyle = STG[st].bg; const x0 = i0 === 0 ? padL : (X(i0 - 1) + X(i0)) / 2, x1 = i === n ? X(n - 1) : (X(i - 1) + X(i)) / 2; g.fillRect(x0, padT, x1 - x0, h - padT - padB); }
        i0 = i;
      }
    }
  }
  g.strokeStyle = css('--border'); g.lineWidth = 1; g.beginPath(); g.moveTo(padL, h - padB + .5); g.lineTo(w - padR, h - padB + .5); g.stroke();
  // 연·반기 눈금 라벨
  const d0 = new Date(c.w_dates[0]), d1 = new Date(c.w_dates[1]); const span = d1 - d0;
  g.fillStyle = css('--text-dim'); g.font = '10px ' + css('--font'); g.textAlign = 'center';
  for (let y = d0.getFullYear(); y <= d1.getFullYear(); y++) for (const m of [0, 6]) { const t = new Date(y, m, 1); if (t < d0 || t > d1) continue; const x = padL + (w - padL - padR) * (t - d0) / span; g.fillText(String(y).slice(2) + '.' + (m === 0 ? '01' : '07'), x, h - 3); }
  g.strokeStyle = '#e8792e'; g.lineWidth = 1.2; g.beginPath(); let st = false;
  ma.forEach((v, i) => { if (v == null) return; const x = X(i), y = Y(v); st ? g.lineTo(x, y) : g.moveTo(x, y); st = true; }); g.stroke();
  g.strokeStyle = '#1d2b4f'; g.lineWidth = 1.4; g.beginPath(); xs.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(0), Y(v))); g.stroke();
  g.fillStyle = '#1d2b4f'; g.beginPath(); g.arc(X(n - 1), Y(xs[n - 1]), 2.2, 0, 7); g.fill();
  g.fillStyle = css('--text'); g.font = 'bold 10.5px ' + css('--font'); g.textAlign = 'left'; g.fillText(fmtPct(c.ret_2y, 0), X(n - 1) + 5, Math.max(10, Math.min(h - padB - 2, Y(xs[n - 1]) + 4)));
}
const STG = { 1: { bg: '#ebedf0', fill: '#cfd3da', nm: '1단계', tx: '#4b5563' }, 2: { bg: '#fde6e6', fill: '#ee8f8f', nm: '2단계', tx: '#b91c1c' }, 3: { bg: '#fbe9c6', fill: '#f2c26a', nm: '3단계', tx: '#92400e' }, 4: { bg: '#dfe6f5', fill: '#8fa7da', nm: '4단계', tx: '#1e40af' } };
function stageTag(c) { return c.stage ? `<span class="stg s${c.stage}${c.stage_flip ? ' flip' : ''}" title="와인스타인 4단계 — 30주선 기울기(4주 전 대비)×종가 위치: 상승·위=2 상승·아래=3 하락·아래=4 하락·위=1${c.stage_flip ? ` · 이번 주 ${c.stage_prev}→${c.stage}단계` : ''}">${c.stage}단계 ${c.stage_w}주째</span>` : ''; }
/* 종목 단계 분포 누적 영역 (아래부터 2·1·3·4) */
function drawStageDist(cv, sd) {
  const [g, w, h] = setupCanvas(cv); const rows = sd.dist, n = rows.length; if (n < 2) return;
  const padL = 2, padR = 58, padT = 6, padB = 18; const W = w - padL - padR, H = h - padT - padB;
  const X = i => padL + W * i / (n - 1), Y = v => padT + H * (1 - v / 100);

  try { const m = await jget('meta.json'); $('#meta').textContent = `한국 ${m.kr_date || '—'} · 미국 ${m.us_date || '—'}${m.etf_date ? ' · ETF ' + m.etf_date : ''} 종가 기준 · 갱신 ${(m.updated_at || '').replace('T', ' ').slice(0, 16)} KST · 매일 자동(한국 16:40 · 미국 06:40)`; } catch (_) { $('#meta').textContent = ''; }
  ['groups_kr', 'groups_us'].forEach(k => state.data[k] && flipBadges(state.data[k]));
  await loadInsights();
  if (INS.ai) $('#ins-btn').classList.add('has');
  $('#ins-btn').onclick = () => openInsight(state.view === 'scan' ? 'scan_' + state.mkt : (state.view === 'index' || state.view === 'etf') ? state.view : state.board);
  renderBoard(); renderScan(); loadHist();
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); b.classList.add('on'); state.view = b.dataset.v; $('#v-board').style.display = state.view === 'board' ? '' : 'none'; $('#v-scan').style.display = state.view === 'scan' ? '' : 'none'; $('#v-etf').style.display = state.view === 'etf' ? '' : 'none'; $('#v-index').style.display = state.view === 'index' ? '' : 'none'; if (state.view === 'index') { if (window.renderIndexNative) renderIndexNative(); } else if (state.view === 'etf') renderEtf(); else if (EXT[state.view]) showExt(state.view); else if (state.view === 'board') renderBoard(); else renderScan(); }));
  document.querySelectorAll('[data-b]').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('[data-b]').forEach(x => x.classList.remove('on')); b.classList.add('on'); state.board = b.dataset.b; renderBoard(); }));
  document.querySelectorAll('#etf-sub [data-c]').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('#etf-sub [data-c]').forEach(x => x.classList.remove('on')); b.classList.add('on'); ETF.cat = b.dataset.c; renderEtf(); }));
  $('#etf-sort').addEventListener('change', e => { ETF.sort = e.target.value; renderEtf(); });
  let qt; $('#etf-q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { ETF.q = e.target.value.trim(); renderEtf(); }, 200); });
  document.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('[data-m]').forEach(x => x.classList.remove('on')); b.classList.add('on'); state.mkt = b.dataset.m; state.tag = null; renderScan(); loadHist(); }));
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => state.view === 'index' ? null : state.view === 'etf' ? renderEtf() : EXT[state.view] ? showExt(state.view) : state.view === 'board' ? renderBoard() : renderScan(), 150); });
}
init();
</script>
<!-- ═══════ 인덱스 하위 탭: 메인 대시보드의 네이티브 지표 렌더러를 그대로 이식 (invest-index 의 INDICATORS 를 읽어 Chart.js 로 전체 차트 한눈에) ═══════ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
#index-native{padding:4px 0 26px}
.ixn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;max-width:1280px;margin:0 auto}
@media(max-width:700px){.ixn-grid{grid-template-columns:1fr}}
.ixn-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--sk-radius,14px);padding:14px;box-shadow:var(--sk-shadow,0 1px 3px rgba(0,0,0,.05))}
.ixn-card h4{margin:0 0 2px;font-size:14px;font-weight:700}
.ixn-card .src{font-size:11px;color:var(--text-dim);margin-bottom:8px}
.ixn-box{height:170px;position:relative}
.ixn-load{padding:50px;text-align:center;color:var(--text-dim);font-size:14px}
.ixn-t{cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.ixn-t:hover{color:var(--accent)}
.ixn-toggle{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.ixn-data{max-height:280px;overflow:auto;border:1px solid var(--panel-2);border-radius:10px}
.ixn-tbl{width:100%;border-collapse:collapse;font-size:12px}
.ixn-tbl th{position:sticky;top:0;background:var(--header);font-size:10.5px;color:var(--text-dim);text-align:right;padding:6px 9px;border-bottom:1px solid var(--border)}
.ixn-tbl th:first-child,.ixn-tbl td:first-child{text-align:left}
.ixn-tbl td{padding:5.5px 9px;text-align:right;border-bottom:1px solid var(--panel-2);font-variant-numeric:tabular-nums}
.ixn-tbl tr:last-child td{border-bottom:none}
.ixn-desc{font-size:11px;color:var(--text-dim);line-height:1.5;margin:-4px 0 8px}
.ixn-warn{font-size:11px;color:#dc2626;font-weight:600;line-height:1.5;margin:-4px 0 8px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:6px 8px}
.ixn-card.wide .ixn-box{height:230px}
.ixn-cat{grid-column:1/-1;font-size:13px;font-weight:800;margin:8px 2px -4px;color:var(--text)}
</style>
<script>
(function(){
  let loaded = false;
  function extractArr(txt, marker){
    const i = txt.indexOf(marker); if(i<0) return null;
    const start = txt.indexOf('[', i);
    let d=0, inStr=null, escp=false;
    for(let j=start;j<txt.length;j++){
      const c = txt[j];
      if(inStr){ if(escp)escp=false; else if(c==='\\')escp=true; else if(c===inStr)inStr=null; continue; }
      if(c==='"'||c==="'"||c==='`'){ inStr=c; continue; }
      if(c==='/'&&txt[j+1]==='/'){ j=txt.indexOf('\n',j); if(j<0)break; continue; }
      if(c==='/'&&txt[j+1]==='*'){ j=txt.indexOf('*/',j)+1; if(j<1)break; continue; }
      if(c==='[') d++;
      else if(c===']'){ d--; if(!d){ try{ return new Function('return '+txt.slice(start,j+1))(); }catch(e){ return null; } } }
    }
    return null;
  }
  let _indsP = null;
  window.fetchIndicators = function(){
    if(_indsP) return _indsP;
    _indsP = fetch('https://raw.githubusercontent.com/whysosary-dot/invest-index/main/index.html?t='+Math.floor(Date.now()/3e5), {cache:'no-store'})
      .then(r=>r.text()).then(html=>{ const inds = extractArr(html, 'const INDICATORS'); if(!inds||!inds.length) throw new Error('no data'); return inds; })
      .catch(e=>{ _indsP = null; throw e; });
    return _indsP;
  };
  /* 인덱스 데이터 요약(토큰 0): 지표별 최신값·직전 대비·최근 3개 추세·전년 동기 대비 */
  window.indexAutoLines = function(inds){
    const L = []; const fmtN = v => Number(v).toLocaleString('ko-KR', {maximumFractionDigits: 1});
    const pc = (a,b) => (b&&a!=null)?((a/b-1)*100):null; const sg = v => v==null?'—':(v>0?'+':'')+v.toFixed(1)+'%';
    const rising=[], falling=[], latest=[];
    inds.forEach(ind=>{
      const d=(ind.data||[]).filter(x=>x&&x.value!=null); if(d.length<2) return;
      const last=d[d.length-1], prev=d[d.length-2]; const chg=pc(last.value, prev.value);
      const t3 = d.slice(-4).map(x=>x.value); const up3 = t3.length>=3 && t3.every((v,i)=>i===0||v>=t3[i-1]); const dn3 = t3.length>=3 && t3.every((v,i)=>i===0||v<=t3[i-1]);
      let yoy=null; const lab=String(last.label); const m=lab.match(/^(\d{4})(.*)$/); if(m){ const py=String(+m[1]-1)+m[2]; const hit=d.find(x=>String(x.label)===py); if(hit) yoy=pc(last.value,hit.value); }
      latest.push(`${ind.name} ${fmtN(last.value)}${ind.unit?ind.unit:''} (${lab}, 직전比 ${sg(chg)}${yoy!=null?', YoY '+sg(yoy):''})`);
      if(up3) rising.push(ind.name); if(dn3) falling.push(ind.name);
    });
    if(latest.length) L.push('최신값: '+latest.join(' · '));
    if(rising.length) L.push('3기간 연속 상승: '+rising.join(' · '));
    if(falling.length) L.push('3기간 연속 하락: '+falling.join(' · '));
    return L;
  };
  async function renderIndexNative(){
    if(loaded) return; loaded = true;
    const box = document.getElementById('index-native');
    try{
      const inds = await window.fetchIndicators();
      box.innerHTML = '<div class="ixn-grid">' + inds.map((ind,i)=>`
        ${ind.category && ind.category!==(inds[i-1]||{}).category && ind.id && String(ind.id).startsWith('dk_') && !String((inds[i-1]||{}).id||'').startsWith('dk_') ? '<div class="ixn-cat">💊 '+ind.category+' 트래커</div>' : ''}
        <div class="ixn-card${ind.chartLines&&ind.products?' wide':''}"><h4 class="ixn-t" data-i="${i}">${ind.name} <span style="font-weight:400;font-size:11px;color:var(--text-dim)">${ind.unit||''}</span><span class="ixn-toggle">데이터 ▸</span></h4>
        <div class="src">${ind.source||''}${ind.category?' · '+ind.category:''}</div>
        <div class="ixn-box"><canvas id="ixn-${i}"></canvas></div>
        <div class="ixn-data" id="ixnd-${i}" hidden></div></div>`).join('') + '</div>';
      inds.forEach((ind,i)=>{
        const data = (ind.data||[]).filter(d=>d&&d.value!=null);
        const cv = document.getElementById('ixn-'+i); if(!cv||!data.length) return;
        /* chartLines + products → 보조 선 (invest-index 엔진과 같은 규약) */
        const extra = (ind.chartLines && ind.products) ? ind.chartLines.map(n=>ind.products.find(p=>p.name===n)).filter(Boolean) : [];
        let labels = data.map(d=>d.label);
        if (extra.length) labels = [...new Set([...labels, ...extra.flatMap(p=>(p.data||[]).filter(d=>d&&d.value!=null).map(d=>d.label))])].sort();
        const mapOf = arr => Object.fromEntries((arr||[]).filter(d=>d&&d.value!=null).map(d=>[d.label, d.avg ?? d.value]));
        const LC = ["#f59e0b","#10b981","#ef4444","#8b5cf6","#06b6d4"];
        const mainMap = mapOf(data);
        const ds = [{ label: ind.mainName || ind.chartMainLabel || ind.name,
            data: labels.map(l=>mainMap[l] ?? null), spanGaps:true,
            borderColor:ind.color||'#3056f0', borderWidth:2.2,
            pointRadius:labels.length>40?0:2.5, pointHitRadius:8, tension:.25 }];
        extra.forEach((p,k)=>{ const m = mapOf(p.data); ds.push({ label:p.name, data:labels.map(l=>m[l] ?? null), spanGaps:true,
            borderColor:LC[k%LC.length], borderWidth:1.4, pointRadius:labels.length>40?0:2, pointHitRadius:8, tension:.25 }); });
        new Chart(cv, { type:'line',
          data:{ labels, datasets: ds },
          options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
            plugins:{ legend:{display:extra.length>0, position:'bottom', labels:{boxWidth:10,font:{size:10},padding:8}} },
            scales:{ x:{ticks:{maxTicksLimit:6,font:{size:9.5},color:'#9aa3b8'},grid:{display:false}},
              y:{reverse:!!ind.reverseY, ticks:{font:{size:9.5},color:'#9aa3b8',maxTicksLimit:5},grid:{color:'#f0f2f7'}} } } });
      });
      /* 지표 이름 클릭 → 차트 ↔ raw 데이터 테이블 토글 */
      box.querySelectorAll('.ixn-t').forEach(t=>t.addEventListener('click', ()=>{
        const i = +t.dataset.i, ind = inds[i];
        const dv = document.getElementById('ixnd-'+i);
        const cb = t.closest('.ixn-card').querySelector('.ixn-box');
        const tg = t.querySelector('.ixn-toggle');
        if(dv.hidden){
          if(!dv.innerHTML){
            const rows = (ind.data||[]).filter(d=>d&&d.value!=null).slice().reverse();
            const hasNote = rows.some(d=>d.note);
            dv.innerHTML = '<table class="ixn-tbl"><thead><tr><th>기간</th><th>값'+(ind.unit?' ('+ind.unit+')':'')+'</th><th>전기比</th>'+(hasNote?'<th style="text-align:left">비고</th>':'')+'</tr></thead><tbody>'
              + rows.map((d,j)=>{ const prev = rows[j+1];
                  const chg = (prev&&prev.value) ? (d.value/prev.value-1)*100 : null;
                  const vcol = d.derived===true ? '#d97706' : (d.derived===false ? '#2563eb' : 'inherit');
                  return `<tr><td>${d.label}</td><td style="color:${vcol}">${Number(d.value).toLocaleString()}</td>
                    <td style="color:${chg==null?'#9aa3b8':(chg>=0?'#d3273e':'#2f56e8')};font-weight:600">${chg==null?'–':(chg>0?'+':'')+chg.toFixed(1)+'%'}</td>${hasNote?`<td style="text-align:left;font-size:10.5px;color:var(--text-dim);white-space:normal">${d.note||''}</td>`:''}</tr>`; }).join('')
              + '</tbody></table>';
          }
          dv.hidden = false; cb.style.display = 'none'; tg.textContent = '차트 ▸';
        } else {
          dv.hidden = true; cb.style.display = ''; tg.textContent = '데이터 ▸';
        }
      }));
    }catch(e){
      box.innerHTML = '<div class="ixn-load">지표 데이터를 불러오지 못했습니다. <button class="btn" onclick="location.reload()">새로고침</button></div>';
      loaded = false;
    }
  }
  window.renderIndexNative = renderIndexNative;
})();
</script>

</body>
</html>

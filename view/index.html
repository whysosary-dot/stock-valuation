<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report viewer</title>
<link rel="stylesheet" href="https://whysosary-dot.github.io/stock-valuation/theme.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden}
  body{zoom:1 !important}  /* 뷰어 자체는 배율 1 — 안쪽 문서가 자기 배율을 가짐 */
  body{display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 10px;background:var(--bg)}
  .bar h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}
  .bar .sub{font-size:12px;color:var(--text-dim);font-weight:500}
  .nav{display:flex;align-items:center;gap:6px;flex-basis:100%}
  .nav button,.nav select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
  .nav button{cursor:pointer;padding:6px 9px}
  .nav button:disabled{opacity:.35;cursor:default}
  .nav select{max-width:280px}
  .nav .right{margin-left:auto;display:flex;gap:6px}
  .nav .right a{font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel)}
  .nav .right a:hover{color:var(--accent);border-color:var(--accent)}
  iframe{flex:1;width:100%;border:none;display:block;background:var(--bg);min-height:0;opacity:0;transition:opacity .15s}
  iframe.ready{opacity:1}
  .msg{padding:30px;color:var(--text-dim);text-align:center}
  @media (max-width:640px){ .bar{padding:10px 10px 8px} .nav select{max-width:170px} }
</style>
</head>
<body>
<div class="bar">
  <h1 id="ttl">Report</h1><span class="sub" id="sub"></span>
  <div class="nav"><button id="prev" title="이전">◀</button><select id="sel" title="날짜 선택"></select><button id="next" title="다음">▶</button>
    <div class="right"><a id="list" href="#" target="_self">목록</a><a id="open" href="#" target="_blank" rel="noopener">새 창 ↗</a></div></div>
</div>
<iframe id="fr" title="report"></iframe>
<script>
/* 날짜별 리포트가 쌓이는 저장소를 하나의 뷰어로 — ◀ 날짜 선택 ▶ + 본문 iframe */
const SRC = {
  us:       { title: 'US Market',  sub: '미국 시장 모닝 브리핑', base: 'https://whysosary-dot.github.io/us-market-briefing/', list: 'index.html',
              dates: h => [...h.matchAll(/\bd:\s*"(\d{4}-\d{2}-\d{2})"/g)].map(m => m[1]), file: d => `briefings/us-market-briefing-${d}.html?v=${d.replace(/-/g, '')}` },
  kr:       { title: 'KR Market',  sub: '국내 시장 마감 브리핑', base: 'https://whysosary-dot.github.io/kr-market-briefing/', list: 'index.html',
              dates: h => [...h.matchAll(/\bd:\s*"(\d{4}-\d{2}-\d{2})"/g)].map(m => m[1]), file: d => `briefings/kr-market-closing-${d}.html?v=${d.replace(/-/g, '')}` },
  awake:    { title: 'Awake',      sub: '전자공시 일일 리포트',  base: 'https://whysosary-dot.github.io/awake-disclosure/', list: 'index.html',
              dates: h => { const seg = h.slice(h.indexOf('const reports'), h.indexOf('];', h.indexOf('const reports'))); return [...seg.matchAll(/\bd:\s*"(\d{4}-\d{2}-\d{2})"/g)].map(m => m[1]); },
              file: d => `reports/AWAKE_${d}.html?v=${Math.floor(Date.now() / 600000)}` },   // 10분 단위 캐시 — 2.7MB 를 매번 다시 받지 않도록
  interest: { title: 'Interest',   sub: '관심종목 모닝 브리프',  base: 'https://whysosary-dot.github.io/watchlist-briefing/', list: 'index.html', json: 'briefings/manifest.json',
              dates: j => (j.briefings || []).map(b => b.date), file: d => `briefings/watchlist-brief-${d}.html` },
};
const q = new URLSearchParams(location.search);
const key = q.get('src') || 'us';
const S = SRC[key] || SRC.us;
const $ = s => document.querySelector(s);
let DATES = [], CUR = '';
const LS = 'sv_view_last_' + key;

function show(d) {
  CUR = d;
  $('#sel').value = d;
  const k = DATES.indexOf(d);
  $('#prev').disabled = !(k >= 0 && k < DATES.length - 1);
  $('#next').disabled = !(k > 0);
  const url = S.base + S.file(d);
  $('#fr').classList.remove('ready');
  $('#fr').src = url;
  skinWatch();
  $('#open').href = url;
  document.title = `${S.title} ${d}`;
  try { localStorage.setItem(LS, d); } catch (_) {}
  try { history.replaceState(null, '', `?src=${key}&d=${d}`); } catch (_) {}
}
// 같은 출처의 리포트 문서에 공통 테마 + 스킨을 주입 (Telegram·Report 탭과 같은 톤). 끄려면 ?raw=1
// 예전 화면이 잠깐 보이지 않도록: 문서 head 가 생기는 즉시(본문 렌더 전) 주입하고, 그때까지 iframe 은 숨긴다.
let _injected = false, _watch = null;
const SKIN_V = Math.floor(Date.now() / 600000);   // 10분 단위 캐시 (매번 새로 받지 않도록)
function injectSkin() {
  if (q.get('raw')) return true;
  try {
    const d = $('#fr').contentDocument; if (!d || !d.head) return false;
    if (d.documentElement.getAttribute('data-skin') === key) return true;
    d.documentElement.setAttribute('data-skin', key);
    // 링크 다운로드를 기다리지 않도록 핵심 규칙은 인라인으로 먼저
    const s = d.createElement('style');
    s.textContent = 'html{background:#eef1f7}body{background:#eef1f7!important;visibility:hidden}' +
      (key === 'awake' ? '.cover,.page-header{display:none!important}' : '');
    d.head.appendChild(s);
    let pending = 2;
    // 테마·스킨이 로드되면 즉시 보여준다 (문서 전체 로드를 기다리지 않음 → 긴 리포트도 점진적으로 렌더)
    const done = () => { if (--pending <= 0) { try { const r = d.createElement('style'); r.textContent = 'body{visibility:visible!important}'; d.head.appendChild(r); } catch (_) {} $('#fr').classList.add('ready'); } };
    for (const href of ['https://whysosary-dot.github.io/stock-valuation/theme.css?v=' + SKIN_V, 'https://whysosary-dot.github.io/stock-valuation/skin.css?v=' + SKIN_V]) {
      const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = href; l.onload = done; l.onerror = done; d.head.appendChild(l);
    }
    setTimeout(done, 1500); setTimeout(done, 1500);   // 네트워크 실패 대비 — 늦어도 1.5초 뒤엔 보이게
    return true;
  } catch (_) { return false; }
}
function skinWatch() {
  clearInterval(_watch); let n = 0;
  _watch = setInterval(() => { n++; if (injectSkin() && n > 2 || n > 400) clearInterval(_watch); }, 25);
}

// Awake 리포트: 종목 페이지마다 밸류에이션 8칸 (KR Screener 일별 JSON 에서 — 같은 출처라 주입 가능)
let _valMap = null;
async function loadValMap() {
  if (_valMap) return _valMap;
  const base = 'https://whysosary-dot.github.io/stock-screener/';
  const idx = await (await fetch(base + 'daily/index.json?t=' + Date.now())).json();
  const day = await (await fetch(base + 'daily/' + idx.latest_date + '.json?t=' + Date.now())).json();
  _valMap = { date: idx.latest_date, by: Object.fromEntries((day.stocks || []).map(s => [s.ticker, s])) };
  return _valMap;
}
const fmtN = (n, d) => (n == null || isNaN(n)) ? '-' : Number(n).toLocaleString('ko-KR', { maximumFractionDigits: d ?? 0 });
const eok = v => v == null ? '-' : v >= 10000 ? (v / 10000).toFixed(v >= 100000 ? 0 : 1) + '조' : fmtN(v) + '억';
function valGridHtml(s, date) {
  if (!s) return '';
  const pos52 = (s.price && s.hi52 && s.lo52 && s.hi52 > s.lo52) ? Math.round((s.price - s.lo52) / (s.hi52 - s.lo52) * 100) : null;
  const chg = s.change_rate, chgCls = chg > 0 ? 'u' : chg < 0 ? 'd' : '';
  return `<div class="sv-val" title="KR Screener ${date} 마감 기준 (네이버 증권)">
    <div>주가<span class="${chgCls}">${fmtN(s.price)}원 ${chg != null ? `<small>(${chg > 0 ? '+' : ''}${fmtN(chg, 2)}%)</small>` : ''}</span></div>
    <div>시총<span>${eok(s.market_cap)}</span></div>
    <div>PER${s.cns_per ? ' / 추정' : ''}<span>${s.per ? fmtN(s.per, 1) : '-'}${s.cns_per ? ` / ${fmtN(s.cns_per, 1)}` : ''}</span></div>
    <div>PBR<span>${s.pbr ? fmtN(s.pbr, 2) : '-'}</span></div>
    <div>EPS<span>${s.eps != null ? fmtN(s.eps) : '-'}</span></div>
    <div>배당<span>${s.div != null ? fmtN(s.div, 2) + '%' : '-'}</span></div>
    <div>외인<span>${s.foreign != null ? fmtN(s.foreign, 1) + '%' : '-'}</span></div>
    <div>52주 위치<span>${pos52 != null ? Math.max(0, Math.min(100, pos52)) + '%' + (pos52 > 100 ? ' <small style="color:#dc2626;font-weight:700">신고가</small>' : pos52 < 0 ? ' <small style="color:#2563eb;font-weight:700">신저가</small>' : '') : '-'}</span>${pos52 != null ? `<div class="bar"><i style="width:${Math.max(0, Math.min(100, pos52))}%"></i></div>` : ''}</div>
  </div>`;
}
async function awakeValuation() {
  try {
    const d = $('#fr').contentDocument; if (!d) return;
    const m = await loadValMap();
    let n = 0;
    d.querySelectorAll('.page[id^="stock-"]').forEach(pg => {
      if (pg.querySelector('.sv-val')) return;
      const code = (pg.id.match(/^stock-(\d{6})-/) || [])[1]; const s = code && m.by[code]; if (!s) return;
      const anchor = pg.querySelector('.stock-meta') || pg.querySelector('.page-body');
      if (!anchor) return;
      anchor.insertAdjacentHTML('afterend', valGridHtml(s, m.date)); n++;
    });
    if (n && !d.getElementById('sv-val-css')) {
      const st = d.createElement('style'); st.id = 'sv-val-css';
      st.textContent = '.sv-val{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;font-size:13px;color:#69738a;border:1px solid #e5e9f1;border-radius:12px;padding:12px 14px;margin:10px 0 14px;background:#f4f6fb}' +
        '.sv-val div span{display:block;font-size:16px;font-weight:800;color:#141b26}.sv-val .u{color:#d3273e}.sv-val .d{color:#2f56e8}' +
        '.sv-val .bar{height:4px;background:#e5e9f1;border-radius:3px;overflow:hidden;margin-top:3px}.sv-val .bar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#f87171)}' +
        '@media (max-width:640px){.sv-val{grid-template-columns:repeat(3,1fr)}}';
      d.head.appendChild(st);
    }
  } catch (e) { console.warn('awake valuation', e); }
}

(async () => {
  $('#ttl').textContent = S.title; $('#sub').textContent = S.sub; $('#list').href = S.base + S.list;
  try {
    let dates;
    if (S.json) { const r = await fetch(S.base + S.json + '?t=' + Date.now()); dates = S.dates(await r.json()); }
    else { const r = await fetch(S.base + S.list + '?t=' + Date.now()); dates = S.dates(await r.text()); }
    DATES = [...new Set(dates)].sort().reverse();
    if (!DATES.length) throw new Error('날짜 목록 없음');
    $('#sel').innerHTML = DATES.map(d => `<option value="${d}">${d}</option>`).join('');
    const want = q.get('d');
    show(want && DATES.includes(want) ? want : DATES[0]);
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', `<div class="msg">목록을 불러오지 못했습니다 (${e.message}). <a href="${S.base}" target="_top">목록 페이지로</a></div>`);
  }
  $('#fr').addEventListener('load', () => { injectSkin(); setTimeout(() => $('#fr').classList.add('ready'), 60); if (key === 'awake') awakeValuation(); });
  $('#sel').onchange = e => show(e.target.value);
  $('#prev').onclick = () => { const k = DATES.indexOf(CUR); if (k < DATES.length - 1) show(DATES[k + 1]); };
  $('#next').onclick = () => { const k = DATES.indexOf(CUR); if (k > 0) show(DATES[k - 1]); };
})();
</script>
</body>
</html>

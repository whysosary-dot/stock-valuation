<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report viewer</title>
<link rel="stylesheet" href="https://whysosary-dot.github.io/stock-valuation/theme.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden}
  body{display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 10px;background:var(--bg)}
  .bar h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}
  .bar .sub{font-size:12px;color:var(--text-dim);font-weight:500}
  .nav{display:flex;align-items:center;gap:6px;flex-basis:100%}
  .nav button,.nav select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
  .nav button{cursor:pointer;padding:6px 9px}
  .nav button:disabled{opacity:.35;cursor:default}
  .nav select{max-width:280px}
  .nav .right{margin-left:auto;display:flex;gap:6px}
  .nav .right a{font-size:12px;color:var(--text-dim);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel)}
  .nav .right a:hover{color:var(--accent);border-color:var(--accent)}
  iframe{flex:1;width:100%;border:none;display:block;background:var(--bg);min-height:0}
  .msg{padding:30px;color:var(--text-dim);text-align:center}
  @media (max-width:640px){ .bar{padding:10px 10px 8px} .nav select{max-width:170px} }
</style>
</head>
<body>
<div class="bar">
  <h1 id="ttl">Report</h1><span class="sub" id="sub"></span>
  <div class="nav"><button id="prev" title="이전">◀</button><select id="sel" title="날짜 선택"></select><button id="next" title="다음">▶</button>
    <div class="right"><a id="list" href="#" target="_self">목록</a><a id="open" href="#" target="_blank" rel="noopener">새 창 ↗</a></div></div>
</div>
<iframe id="fr" title="report"></iframe>
<script>
/* 날짜별 리포트가 쌓이는 저장소를 하나의 뷰어로 — ◀ 날짜 선택 ▶ + 본문 iframe */
const SRC = {
  us:       { title: 'US Market',  sub: '미국 시장 모닝 브리핑', base: 'https://whysosary-dot.github.io/us-market-briefing/', list: 'index.html',
              dates: h => [...h.matchAll(/\bd:\s*"(\d{4}-\d{2}-\d{2})"/g)].map(m => m[1]), file: d => `briefings/us-market-briefing-${d}.html?v=${d.replace(/-/g, '')}` },
  kr:       { title: 'KR Market',  sub: '국내 시장 마감 브리핑', base: 'https://whysosary-dot.github.io/kr-market-briefing/', list: 'index.html',
              dates: h => [...h.matchAll(/\bd:\s*"(\d{4}-\d{2}-\d{2})"/g)].map(m => m[1]), file: d => `briefings/kr-market-closing-${d}.html?v=${d.replace(/-/g, '')}` },
  awake:    { title: 'Awake',      sub: '전자공시 일일 리포트',  base: 'https://whysosary-dot.github.io/awake-disclosure/', list: 'index.html',
              dates: h => { const seg = h.slice(h.indexOf('const reports'), h.indexOf('];', h.indexOf('const reports'))); return [...seg.matchAll(/\bd:\s*"(\d{4}-\d{2}-\d{2})"/g)].map(m => m[1]); },
              file: d => `reports/AWAKE_${d}.html?v=${Date.now()}` },
  interest: { title: 'Interest',   sub: '관심종목 모닝 브리프',  base: 'https://whysosary-dot.github.io/watchlist-briefing/', list: 'index.html', json: 'briefings/manifest.json',
              dates: j => (j.briefings || []).map(b => b.date), file: d => `briefings/watchlist-brief-${d}.html` },
};
const q = new URLSearchParams(location.search);
const key = q.get('src') || 'us';
const S = SRC[key] || SRC.us;
const $ = s => document.querySelector(s);
let DATES = [], CUR = '';
const LS = 'sv_view_last_' + key;

function show(d) {
  CUR = d;
  $('#sel').value = d;
  const k = DATES.indexOf(d);
  $('#prev').disabled = !(k >= 0 && k < DATES.length - 1);
  $('#next').disabled = !(k > 0);
  const url = S.base + S.file(d);
  $('#fr').src = url;
  $('#open').href = url;
  document.title = `${S.title} ${d}`;
  try { localStorage.setItem(LS, d); } catch (_) {}
  try { history.replaceState(null, '', `?src=${key}&d=${d}`); } catch (_) {}
}
(async () => {
  $('#ttl').textContent = S.title; $('#sub').textContent = S.sub; $('#list').href = S.base + S.list;
  try {
    let dates;
    if (S.json) { const r = await fetch(S.base + S.json + '?t=' + Date.now()); dates = S.dates(await r.json()); }
    else { const r = await fetch(S.base + S.list + '?t=' + Date.now()); dates = S.dates(await r.text()); }
    DATES = [...new Set(dates)].sort().reverse();
    if (!DATES.length) throw new Error('날짜 목록 없음');
    $('#sel').innerHTML = DATES.map(d => `<option value="${d}">${d}</option>`).join('');
    const want = q.get('d');
    show(want && DATES.includes(want) ? want : DATES[0]);
  } catch (e) {
    document.body.insertAdjacentHTML('beforeend', `<div class="msg">목록을 불러오지 못했습니다 (${e.message}). <a href="${S.base}" target="_top">목록 페이지로</a></div>`);
  }
  // 같은 출처의 리포트 문서에 공통 테마 + 스킨을 주입 (Telegram·Report 탭과 같은 톤). 끄려면 ?raw=1
  $('#fr').addEventListener('load', () => {
    if (q.get('raw')) return;
    try {
      const d = $('#fr').contentDocument; if (!d || !d.head) return;
      d.documentElement.setAttribute('data-skin', key);
      for (const href of ['https://whysosary-dot.github.io/stock-valuation/theme.css', 'https://whysosary-dot.github.io/stock-valuation/skin.css?v=' + Date.now()]) {
        const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = href; d.head.appendChild(l);
      }
    } catch (_) {}
  });
  $('#sel').onchange = e => show(e.target.value);
  $('#prev').onclick = () => { const k = DATES.indexOf(CUR); if (k < DATES.length - 1) show(DATES[k + 1]); };
  $('#next').onclick = () => { const k = DATES.indexOf(CUR); if (k > 0) show(DATES[k - 1]); };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rules — 투자 규칙 · 자동 점검</title>
<link rel="stylesheet" href="https://whysosary-dot.github.io/stock-valuation/theme.css">
<style>
/* 규칙 탭: 다이어리(invest-private sv/diary.json)를 읽어 규칙 준수 여부를 자동 점검한다. 토큰·데이터는 메인 대시보드와 같은 localStorage 를 쓴다. */
body{padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.top h1{font-size:16px;font-weight:800;margin:0}
.top .meta{font-size:12px;color:var(--text-dim)}
.top .rf{margin-left:auto;border:1px solid var(--border-strong);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text)}
.intro{font-size:12.5px;color:var(--text-dim);line-height:1.65;margin:0 0 12px}
.intro b{color:var(--text)}
.sec-h{font-size:14px;font-weight:800;margin:16px 0 8px;display:flex;align-items:baseline;gap:8px}
.sec-h .s{font-size:12px;color:var(--text-dim);font-weight:500}
/* 점검 카드 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ck{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0;border-left:5px solid var(--border-strong)}
.ck.ok{border-left-color:#16a34a}.ck.warn{border-left-color:#d97706}.ck.bad{border-left-color:#dc2626}.ck.na{border-left-color:var(--border-strong)}
.ck .t{font-size:12px;color:var(--text-dim);font-weight:600;display:flex;gap:6px;align-items:center}
.ck .t .st{margin-left:auto;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px}
.ck.ok .st{background:#eef7ee;color:#166534}.ck.warn .st{background:#fff7e6;color:#9a5b00}.ck.bad .st{background:#fdeef0;color:#b91c1c}.ck.na .st{background:var(--panel-2);color:var(--text-dim)}
.ck .v{font-size:22px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.ck .v small{font-size:12px;font-weight:600;color:var(--text-dim)}
.ck .d{font-size:11.5px;color:var(--text-dim);line-height:1.55}
.ck .d b{color:var(--text)}
.score{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:0 0 12px;box-shadow:var(--shadow);flex-wrap:wrap}
.score .big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.score .big.g{color:#16a34a}.score .big.y{color:#d97706}.score .big.r{color:#dc2626}
.score .txt{font-size:12.5px;color:var(--text-dim);line-height:1.6}
.score .txt b{color:var(--text)}
/* 규칙 카드 */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.rc{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.rc .no{display:inline-block;background:var(--text);color:#fff;font-weight:800;font-size:11px;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.rc h3{font-size:14px;margin:0 0 6px;font-weight:800;line-height:1.4}
.rc .rule{font-size:13px;line-height:1.65;margin:0 0 8px}
.rc .rule b{color:#b91c1c}
.rc .why{font-size:12px;color:var(--text-dim);line-height:1.6;border-top:1px dashed var(--border);padding-top:8px;margin-top:6px}
.rc .why b{color:var(--text)}
.rc .why .q{display:block;margin:3px 0 0;padding-left:8px;border-left:2px solid var(--border-strong);font-style:italic}
.rc .chk{font-size:11px;margin-top:8px;color:var(--text-dim)}
.rc .chk span{display:inline-block;border:1px solid var(--border-strong);border-radius:5px;padding:0 6px;margin-right:4px;background:var(--panel-2)}
.rc .chk span.auto{border-color:#bfe3c6;background:#eef7ee;color:#166534}
/* 표 */
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
th{text-align:right;font-weight:700;color:var(--text-dim);padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.tbl{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 8px;box-shadow:var(--shadow);overflow:auto}
.bad-t{color:#dc2626;font-weight:700}.ok-t{color:#16a34a;font-weight:700}
.note{font-size:11.5px;color:var(--text-dim);margin:8px 0 0;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <h1>📏 Rules — 투자 규칙 · 자동 점검</h1>
  <span class="meta" id="meta">다이어리 불러오는 중…</span>
  <button class="rf" id="rf">↻ 다시 점검</button>

<p class="intro">규칙 6개는 다이어리 5~10월(77일)을 복기해 뽑은 것이고, 점검은 <b>Diary 탭 데이터(포트 이력·시나리오·매매일지)</b>를 그대로 읽어 자동으로 합니다. 의지가 아니라 <b>장치</b>로 지키는 것이 목적입니다. 빨강은 지금 규칙을 어기고 있다는 뜻, 주황은 주의, 회색은 데이터가 부족해 판단 보류입니다.</p>

<div class="score" id="score"></div>

<div class="sec-h">규칙 <span class="s">— 각 규칙 아래에 왜 이 규칙이 생겼는지(다이어리 근거)를 적어 두었습니다</span></div>
<div class="rgrid" id="rules"></div>

<div class="sec-h">추이 <span class="s">— 월별 매매 횟수 · 포트 집중도 이력</span></div>

  <div class="tbl" id="t-month"></div>
  <div class="tbl" id="t-pf"></div>
</div>

<script>
/* ── 규칙 정의 ── */
const LIMITS = { maxW: 35, minN: 3, tradesMo: 10, bigMove: 7, diaryGap: 5, rr: 3 };
const RULES = [
  { n: 1, h: '매수 전 시나리오 시트 필수', rule: '매수 근거 · 매도 조건(시나리오가 깨지는 조건) · 안전가(safePx)가 비어 있으면 <b>사지 않는다</b>. 근거가 "모르겠음"이면 비중 10%를 넘길 수 없다.',
    why: '확신 없는 포지션이 급락일에 가장 먼저 흔들렸다.', q: ['알파벳 — 매수 근거 "모르겠음", 매도 "수익일 때". 포트 메모: "왜 들고 있는 건지 스스로 납득이 안 된다"', '7/2 한화오션 — "캐나다 잠수함 수주인 줄 알고 들어갔는데 국내 구축함… 제대로 확인도 안 하고 급하게 들어감"'], auto: '시나리오 미작성 보유종목' },
  { n: 2, h: '한 종목 최대 35% · 최소 3종목', rule: '어떤 확신이 들어도 한 종목은 전체의 <b>35%</b>를 넘기지 않고, 종목은 <b>3개 이상</b> 유지한다. 몰빵은 리밸런싱이라는 카드를 버리는 것이다.',
    why: '"몰빵 절대 금지"를 6/2·6/4·6/19·6/22 네 번 썼지만 포트 이력에 한 종목 100%가 7/28·8/4·9/1 세 번 나온다. 큰 손실은 전부 몰빵 상태에서 났다.', q: ['7/31 "현마엔 어닝 쇼크 -16%. 몰빵했으니 자산의 16%가 증발"', '8/19 "몰빵은 리밸런싱이라는 카드를 버리는 것이다. 항상 카드가 많을수록 유리하다"'], auto: '최대 비중 · 종목 수' },
  { n: 3, h: '±7% 움직인 날은 그 종목 매매 금지', rule: '보유·관심 종목이 당일 <b>±7% 이상</b> 움직이면 그날은 매매하지 않는다. 일기를 먼저 쓰고 <b>다음 날</b> 결정한다. NXT·장 초반 매매는 특히 금지.',
    why: '큰 손실 매매는 예외 없이 급등락 당일, 그것도 장 초반 반응이었다. 하루 미뤘으면 대부분 피할 수 있었다.', q: ['7/28 "한엔 -7% 빠져서 10일선 이탈하길래 매도했는데 -2%로 마감. 그냥 돈을 갖다 쳐버렸다"', '8/27 "DN오토모티브 3일간 -35% 빼길래 멘탈 나가서 전량 매도… 장 마감하고 NDR 리포트가 나와서 다시 허겁지겁 매수"'], auto: '급등락 당일 매매(추정)' },
  { n: 4, h: '리서치 북 90% · 트레이딩 북 10%', rule: '계좌를 둘로 나눈다. <b>리서치 북</b>(90%)은 3~5종목, 보유 6~12개월, 리밸런싱은 분기 1회 또는 시나리오 붕괴 시에만. <b>트레이딩 북</b>(10%)은 손익을 따로 기록하고 3개월 연속 마이너스면 폐쇄.',
    why: '리서치로 번 돈을 트레이딩으로 잃는 구조였다. 가치 쪽(제주 아이디어, 10/12 DN오토, 한라IMS)은 벌었고 트레이딩 쪽은 전부 잃었다.', q: ['6/8 "타이밍 매매로 돈을 단 한 번도 번 적이 없다"', '5/28 "단타도 정확히 아는 이슈 아니면 들어가지 말자… 앞으로 단타 금지"', '8/6 "메지온 IR 전에 비중 10% 들어갔다가 -18% 손절. 이벤트 매매는 이제 하지 말자"'], auto: '월간 매매 횟수' },
  { n: 5, h: '매도는 가격이 아니라 시나리오로', rule: '진입할 때 "<b>이게 깨지면 판다</b>"를 한 줄로 적는다. 상대 수익률(다른 종목이 더 오른다)은 매도 사유가 아니다. 트림은 기계적으로: <b>+50%에서 1/3</b>.',
    why: '제주반도체 시나리오의 매도 조건은 "2분기 어닝쇼크 시"였는데 실제 매도 사유는 "전닉보다 덜 오른다"였다. +60% 수익이 평단 아래 매도로 끝났다.', q: ['7/22 "수익률 60% 가까이 갔던 종목인데… 차라리 중간에 좀 팔 걸"', '5/22 "절대 많이 올랐다는 이유로 팔지 않기… 나중에 틀리면 복기하면 되지"'], auto: '시나리오 매도조건 공란' },
  { n: 6, h: '매일 쓴다 — 매매가 없어도', rule: '일기는 매매의 결과가 아니라 매매를 막는 장치다. 매매하고 싶은 날일수록 <b>먼저 쓴다</b>. 5일 이상 비우지 않는다.',
    why: '일기를 쓰지 않은 기간(8월 말~9월)에 자신감이 무너졌고, 매일 쓴 10월에 규칙과 행동이 처음으로 일치했다.', q: ['10/12 "내 스트라이크 존에 올 때까지 기다리고 아니면 보내버리기. 기억할 만한 매매다"', '10/16 "투자 아이디어의 기간을 6개월~1년으로 잡고 3종목 이상 다변화하면 리밸런싱에서 자유로워질 것"'], auto: '마지막 일기 경과일' },
  { n: 7, h: '손익비 3 이상일 때만 접근', rule: '손익비 = <b>상방 ÷ 하방</b>. 상방 = (매도 주가 − 현재가) ÷ 현재가, 하방 = (현재가 − 안전마진가) ÷ 현재가. 이 값이 <b>3 미만이면 사지 않는다</b>. 현재가가 <b>안전마진가 아래</b>면 하방이 0이라 손익비 ∞ — 가장 좋은 접근 구간. 매도 주가·안전마진가가 없으면 손익비를 알 수 없으므로 역시 사지 않는다.',
    why: '기대수익이 작은데 들어간 포지션은 떨어지면 버티지 못하고, 올라도 금방 팔게 된다. 10/12 DN오토는 기대수익 10%일 때 참았다가 20%일 때 들어간 것이 "기억할 만한 매매"였다.', q: ['10/12 "NXT에서 -10%일 때 목표 시총 3조원 기준 수익률이 10% 정도여서 베팅하지 않았다… 기대 수익률이 20%일 때 베팅한 것이 참 잘한 일"', '8/12 "제주반도체 적정 시총은 이미 어느정도 왔고 더 먹을 룸과 떨어질 구간의 손익비가 좋은게 맞을까?"'], auto: '보유 종목 손익비 (시나리오 매도주가·안전마진가 · 현재가)' },
  { n: 8, h: '시초가에 사지 않는다', rule: 'NXT·동시호가·장 시작 후 <b>첫 1시간(10시 전)</b>에는 매수하지 않는다. 시초가는 전날 밤 뉴스와 감정이 한꺼번에 반영되는 가장 비싼 가격이다. 사고 싶으면 <b>10시 이후</b> 또는 <b>장 마감 30분 전</b>에, 매매일지 메모에 체결 시각을 적는다.',
    why: '시초·NXT 매수는 거의 예외 없이 고점 매수였고, 참았을 때(10/12 DN오토)가 기억할 만한 매매가 됐다.', q: ['5/11 "하닉 오전 NXT에서 8프로밖에 안 오르길래 DN오토모티브 물량 40% 매도해서 하이닉스 매수함" → 같은 날 "한솔테크닉스 +16%에 다 팔았는데 상한가"', '5/15 "일단 시초에 베팅해놓고 공부해도 충분하다고 생각해서 DN오토모티브 절반 매도해서 1억원 베팅"', '7/2 "캐나다 잠수함 수주 성공인줄 알고 들어갔는데… 제대로 확인도 안 하고 급하게 들어감"', '10/12 "NXT에서 -10%일 때 1주 샀는데… 베팅하지 않았다. 다행히 NXT에서 참고 본장에서 기대 수익률이 20%일 때 베팅한 것이 참 잘한 일"'], auto: '시초·NXT 매수 (일기·메모 문장에서 추정)' },
];

/* ── 데이터 로드: localStorage(메인 대시보드 동기화 사본) → GitHub(invest-private) ── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = h => String(h == null ? '' : h).replace(/<br\s*\/?>|<\/p>|<\/div>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
function lsDiary() { try { return JSON.parse(localStorage.getItem('sv_diary_v1') || 'null'); } catch (_) { return null; } }
async function ghDiary() {
  const pat = (localStorage.getItem('sv_github_pat') || '').trim(); if (!pat) return { err: '토큰 없음 (메인 ⚙️ 에서 저장)' };
  const r = await fetch(`https://api.github.com/repos/whysosary-dot/invest-private/contents/sv/diary.json?ref=main&t=${Date.now()}`, { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw+json', Authorization: `token ${pat}` } });
  if (!r.ok) return { err: `GitHub ${r.status}` };
  return { data: await r.json() };
}
/* Stock Valuation 의 현재가 (invest-private sv/stocks.json) — 손익비 계산용. 못 읽으면 시나리오의 평단(avgPx)으로 대체 */
let STOCKS = null;
async function ghStocks() {
  try {
    const pat = (localStorage.getItem('sv_github_pat') || '').trim(); if (!pat) return;
    const r = await fetch(`https://api.github.com/repos/whysosary-dot/invest-private/contents/sv/stocks.json?ref=main&t=${Math.floor(Date.now() / 600000)}`, { headers: { Accept: 'application/vnd.github.raw+json', Authorization: `token ${pat}` } });
    if (r.ok) STOCKS = (await r.json()).stocks || null;
  } catch (_) {}
}
function findStock(name) {  // 대시보드 scFindStock 과 같은 규칙
  if (!STOCKS) return null; const norm = x => String(x || '').toLowerCase().replace(/\s+/g, ''); const n = norm(name); if (!n) return null;
  let hit = STOCKS.find(x => norm(x.name) === n);
  if (!hit) { const c = STOCKS.filter(x => norm(x.name).includes(n) || n.includes(norm(x.name))); if (c.length === 1) hit = c[0]; }
  return hit || null;
}

/* ── 분석 ── */
const KST = () => new Date(Date.now() + 9 * 3600e3);
const ymd = d => d.toISOString().slice(0, 10);
function analyze(d) {
  const out = {};
  // 포트 이력(최신)
  const hist = (d.pfHist || []).slice().sort((a, b) => a.d < b.d ? -1 : 1);
  out.hist = hist.map(h => { const tot = h.items.reduce((s, i) => s + (+i.amt || 0), 0); const st = h.items.filter(i => i.name !== '현금' && +i.amt > 0); const mx = st.reduce((m, i) => Math.max(m, +i.amt), 0); const top = st.find(i => +i.amt === mx); return { d: h.d, n: st.length, maxW: tot ? mx / tot * 100 : 0, top: top ? top.name : '', tot, cash: tot ? (h.items.find(i => i.name === '현금') || { amt: 0 }).amt / tot * 100 : 0 }; });
  out.last = out.hist[out.hist.length - 1] || null;

  $('#score').innerHTML = `<div class="big ${g}">${ok}/${tot}</div><div class="txt"><b>자동 점검 ${tot}항목 중 ${ok}개 준수</b> (${pct}%)<br>데이터: ${srcLabel} · 포트 이력 ${a.last ? a.last.d : '—'} · 일기 ${a.diaryDays}일 · 매매 ${Object.values(a.byMo).reduce((s, x) => s + x, 0)}건</div>`;
  $('#chk-s').textContent = `${ymd(KST())} 기준`;
  // 추이 표
  const mos = Object.keys(a.byMo).sort();
  $('#t-month').innerHTML = `<table><thead><tr><th>월</th><th>매매 횟수</th><th>판정</th></tr></thead><tbody>${mos.map(m => `<tr><td>${m}</td><td>${a.byMo[m]}</td><td class="${a.byMo[m] > LIMITS.tradesMo ? 'bad-t' : 'ok-t'}">${a.byMo[m] > LIMITS.tradesMo ? '과다' : '양호'}</td></tr>`).join('') || '<tr><td colspan=3>매매 기록 없음</td></tr>'}</tbody></table>`;
  $('#t-pf').innerHTML = `<table><thead><tr><th>포트 이력</th><th>종목</th><th>최대 비중</th><th>1위 종목</th><th>총액(억)</th></tr></thead><tbody>${a.hist.slice().reverse().map(h => `<tr><td>${h.d}</td><td class="${h.n < LIMITS.minN ? 'bad-t' : ''}">${h.n}</td><td class="${h.maxW > LIMITS.maxW ? 'bad-t' : 'ok-t'}">${h.maxW.toFixed(0)}%</td><td style="text-align:left">${esc(h.top)}</td><td>${(h.tot / 1e8).toFixed(2)}</td></tr>`).join('') || '<tr><td colspan=5>포트 이력 없음</td></tr>'}</tbody></table>`;
  $('#note').textContent = '판정 기준: 시초·NXT 매수(일기 문장 추정, 최근 30일 1건 주의·2건 위반) · 손익비 3 (신호판 — 🟢 3 이상 접근 가능, ⭐ 안전마진 이하면 하방 0으로 최적 구간, 🔴 3 미만 접근 금지; 점수에는 매도주가·안전마진가 미설정 종목만 반영; 현재가는 Stock Valuation, 없으면 평단) · 최대 비중 35%(50% 초과 시 위반, 🎯 목표 포트의 실제 칸 기준 — 비어 있으면 포트 이력) · 최소 3종목 · 이달 매매 10건 · ±7% 당일 매매(추정) · 일기 5일 공백. 매매는 매매일지·일기 본문·포트 비중 스냅샷 변화(커밋 때 자동 기록)에서 모읍니다. 기준값은 rules/index.html 상단 LIMITS 에서 바꿀 수 있습니다. 급등락 당일 매매는 가격 데이터가 아니라 일기 문장에서 추정하므로 참고용입니다.';
}
function renderRules() {
  $('#rules').innerHTML = RULES.map(r => `<div class="rc"><h3><span class="no">규칙 ${r.n}</span>${esc(r.h)}</h3><p class="rule">${r.rule}</p>
    <div class="why"><b>왜:</b> ${esc(r.why)}${(r.q || []).map(q => `<span class="q">${esc(q)}</span>`).join('')}</div>
    <div class="chk">${r.auto ? `<span class="auto">자동 점검 · ${esc(r.auto)}</span>` : ''}</div></div>`).join('');
}
async function main() {
  renderRules();
  await ghStocks();
  const ls = lsDiary();
  if (ls && (ls.pfHist || ls.scenario)) { render(ls, '이 기기의 Diary 사본'); $('#meta').textContent = 'GitHub 최신본 확인 중…'; }
  const g = await ghDiary();
  if (g.data) { render(g.data, 'GitHub invest-private (최신)'); $('#meta').textContent = 'GitHub 최신 다이어리 기준'; }
  else if (ls) $('#meta').textContent = `GitHub 미연결 (${g.err}) — 이 기기 사본으로 점검`;
  else { $('#meta').textContent = `다이어리를 읽을 수 없습니다 (${g.err})`; $('#score').innerHTML = '<div class="txt">메인 대시보드 ⚙️ 에서 GitHub 토큰을 저장하거나, Diary 탭을 한 번 열어 동기화한 뒤 다시 점검하세요.</div>'; }
}
$('#rf').onclick = main;
main();
</script>
</body>
</html>

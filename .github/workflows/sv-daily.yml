name: sv-daily
# 매일 06:00 · 17:00 KST — 전 종목 시총 + 1y/3y 차트 이력 (invest-private sv/stocks.json) + 밸류에이션(네이버)
on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST
    - cron: '0 8 * * *'    # 17:00 KST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sv-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance flask flask-cors
      - name: daily update (시총 + 차트 이력)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TZ: Asia/Seoul
        run: python daily_update.py
      - name: valuation (네이버 PER/PBR/EPS…)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TZ: Asia/Seoul
        run: python val_update.py

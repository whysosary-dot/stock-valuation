name: pf-monthly
# 매월 28~31일 21:00 KST — 스크립트가 '이 달의 마지막 평일'인지 판정해 포트 합계 스냅샷 → invest-private sv/pf_monthly.json
on:
  schedule:
    - cron: '0 12 28-31 * *'
  workflow_dispatch:
    inputs:
      force:
        description: '마지막 평일이 아니어도 강제 기록 (--force)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TZ: Asia/Seoul
        run: python pf_monthly_snapshot.py ${{ inputs.force && '--force' || '' }}

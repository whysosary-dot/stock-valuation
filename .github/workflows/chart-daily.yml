name: chart-daily
# Chart 탭 — 시장 그룹판 + 일봉·주봉 스캔 (Claude 토큰 0, GitHub 서버 실행)
#   KR 목표: 평일 16:40 KST 이후  → chart/data/groups_kr.json, scan_kr.json
#   US 목표: 평일 06:40 KST 이후(미국 마감 후) → groups_us.json, groups_macro.json, scan_us.json
# GitHub cron 은 수 시간 지연될 수 있어 "지금 몇 시냐"로 시장을 고르지 않고,
# meta.json 의 kr_date / us_date 가 '기대 날짜'보다 오래됐는지(= 아직 안 갱신됐는지)로 판단.
# 그래서 슬롯을 넉넉히 두어도, 이미 갱신된 시장은 1초 만에 끝남.
on:
  schedule:
    - cron: '41 7 * * 1-5'    # 16:41 KST
    - cron: '53 8 * * 1-5'    # 17:53 KST
    - cron: '17 10 * * 1-5'   # 19:17 KST (지연 보험)
    - cron: '29 13 * * 1-5'   # 22:29 KST (지연 보험)
    - cron: '43 21 * * 0-4'   # 06:43 KST 다음날
    - cron: '53 22 * * 0-4'   # 07:53 KST
    - cron: '17 1 * * 1-5'    # 10:17 KST (지연 보험)
  workflow_dispatch:
    inputs:
      market:
        description: 'kr | us | both | auto'
        default: 'auto'
permissions:
  contents: write
concurrency:
  group: chart-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 데이터는 main 이 아니라 이력 없는 orphan 브랜치 `data` 에 (매일 단일 커밋으로 강제 덮어쓰기 → 저장소 크기 고정).
      # 페이지·스크립트는 raw.githubusercontent.com/whysosary-dot/stock-valuation/data/chart/data/… 에서 읽는다.
      - name: data branch → chart/data
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            rm -rf chart/data && mkdir -p chart/data
            git archive FETCH_HEAD | tar -x -C chart/data
            echo "data 브랜치에서 복원: $(ls chart/data | wc -l)개"
          else
            echo "data 브랜치 없음 — main 의 chart/data 로 시작(최초 1회)"
          fi
      - name: decide market
        id: m
        run: |
          IN="${{ github.event.inputs.market }}"
          python3 - "$IN" <<'EOF' >> $GITHUB_OUTPUT
          import json, sys, datetime as dt
          arg = (sys.argv[1] or "auto").strip()
          if arg in ("kr", "us", "both"):
              print(f"mkt={arg}"); sys.exit()
          try: meta = json.load(open("chart/data/meta.json"))
          except Exception: meta = {}
          def expected(tz_hours, close_h, close_m):
              now = dt.datetime.utcnow() + dt.timedelta(hours=tz_hours)
              d = now.date()
              if (now.hour, now.minute) < (close_h, close_m): d -= dt.timedelta(days=1)
              while d.weekday() >= 5: d -= dt.timedelta(days=1)
              return d.isoformat()
          # KR: 15:30 마감 + 네이버 반영 여유 → 16:30 KST 이후 당일 기대
          # US: 16:00 ET 마감 + 여유 → 17:00 ET 이후 당일 기대 (ET = UTC-4/-5; 보수적으로 -5)
          exp_kr = expected(9, 16, 30)
          exp_us = expected(-5, 17, 0)
          need = []
          if meta.get("kr_date", "") < exp_kr: need.append("kr")
          if meta.get("us_date", "") < exp_us: need.append("us")
          print("mkt=" + ("+".join(need) if need else "none"))
          print(f"info=kr {meta.get('kr_date')}→{exp_kr} / us {meta.get('us_date')}→{exp_us}")
          EOF
          cat $GITHUB_OUTPUT
      - name: deps
        if: steps.m.outputs.mkt != 'none'
        run: pip install -q requests yfinance pandas lxml
      - name: build
        if: steps.m.outputs.mkt != 'none'
        env:
          SV_PAT: ${{ secrets.SV_PAT }}
        run: |
          M="${{ steps.m.outputs.mkt }}"
          case "$M" in both|kr|kr+us) python3 chart/build_chart.py kr 2>&1 | grep -v "Failed download\|possibly delisted\|Invalid Crumb" | tail -12 ;; esac
          case "$M" in both|us|kr+us) python3 chart/build_chart.py us 2>&1 | grep -v "Failed download\|possibly delisted\|Invalid Crumb" | tail -12 ;; esac
      - name: push data branch (orphan, 단일 커밋)
        if: steps.m.outputs.mkt != 'none'
        run: |
          cd chart/data
          rm -rf .git && git init -q && git checkout -q --orphan data
          git config user.email "whysosary@naver.com"
          git config user.name "리송"
          git add -A
          git commit -q -m "chart data $(date -u -d '+9 hours' +%F) ${{ steps.m.outputs.mkt }} (actions, orphan)"
          for i in 1 2 3; do
            git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data && { echo "pushed data ($(git rev-parse --short HEAD))"; exit 0; }
            echo "push 재시도 $i"; sleep $((i*7))
          done
          exit 1

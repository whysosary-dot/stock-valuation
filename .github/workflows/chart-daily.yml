name: chart-daily
# Chart 탭 — 시장 그룹판 + 일봉·주봉 스캔 (Claude 토큰 0, GitHub 서버 실행)
#   KR: 평일 16:40 KST (07:40 UTC) + 보험 17:50 KST  → chart/data/groups_kr.json, scan_kr.json
#   US: 평일 06:40 KST (21:40 UTC 전날) + 보험 07:50 KST → groups_us.json, groups_macro.json, scan_us.json
# 같은 날 두 번 돌아도 같은 파일을 덮어쓰므로 무해. cron 분은 정각·30분을 피함(GitHub 혼잡 슬롯).
on:
  schedule:
    - cron: '41 7 * * 1-5'
    - cron: '53 8 * * 1-5'
    - cron: '43 21 * * 1-5'
    - cron: '53 22 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: 'kr | us | both'
        default: 'both'
permissions:
  contents: write
concurrency:
  group: chart-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests yfinance pandas lxml
      - name: decide market
        id: m
        run: |
          H=$(date -u +%-H); IN="${{ github.event.inputs.market }}"
          if [ -n "$IN" ]; then echo "mkt=$IN" >> $GITHUB_OUTPUT
          elif [ $H -ge 5 ] && [ $H -le 12 ]; then echo "mkt=kr" >> $GITHUB_OUTPUT
          else echo "mkt=us" >> $GITHUB_OUTPUT; fi
      - name: build
        run: |
          M="${{ steps.m.outputs.mkt }}"
          if [ "$M" = "both" ] || [ "$M" = "kr" ]; then python3 chart/build_chart.py kr 2>&1 | grep -v "Failed download\|possibly delisted\|Invalid Crumb" | tail -12; fi
          if [ "$M" = "both" ] || [ "$M" = "us" ]; then python3 chart/build_chart.py us 2>&1 | grep -v "Failed download\|possibly delisted\|Invalid Crumb" | tail -12; fi
      - name: commit
        run: |
          git config user.email "whysosary@naver.com"
          git config user.name "리송"
          git add -A chart/data
          if git diff --cached --quiet; then echo "변동 없음"; else
            git commit -q -m "chart: $(date -u -d '+9 hours' +%F) ${{ steps.m.outputs.mkt }} (actions)" && git push -q && git log --oneline -1; fi

name: price-update
# 장중 10분 간격 주가·시총·등락률 갱신 (Claude 없이 GitHub 서버에서 실행 — 토큰 0)
# GitHub cron 은 수십 분~수 시간씩 밀리거나 건너뛴다(2026-11-02·03 한국장 첫 갱신 12:00·13:19, 미국장은 마감 40분 전에야 시작).
# 그래서 2026-11-05부터 '릴레이' 방식: 한 run 이 약 5시간 35분 동안 깨어 있으면서
#   장중(KR 09:00~15:45 KST · US 22:30~07:15 KST, 평일)이면 10분마다 갱신, 장 밖이면 대기하고,
#   끝날 때 다음 run 을 직접 발동(workflow_dispatch)한다 → cron 지연과 무관하게 항상 하나가 깨어 있음.
# cron 은 릴레이가 끊겼을 때 다시 잇는 보험. concurrency 로 실행 중 1개 + 대기 1개만 유지(중복 증식 없음).
# 릴레이를 멈추려면 Actions 에서 실행 중인 run 을 Cancel (취소되면 다음 run 을 발동하지 않음).
on:
  schedule:
    - cron: '0 0-6 * * 1-5'      # KR 장중 매시 (보험)
    - cron: '30 13-21 * * 1-5'   # US 장중 매시 (보험)
  workflow_dispatch:
concurrency:
  group: price-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q yfinance flask flask-cors
      - name: relay loop (장중 10분마다 갱신, 약 335분)
        env:
          GITHUB_TOKEN: ${{ secrets.SV_PAT }}
        run: |
          DEADLINE=$(( $(date +%s) + 335*60 ))
          inwin() {   # 평일(UTC 월~금) KR 00:00~06:45 UTC, US 13:30~22:15 UTC
            [ "$(date -u +%u)" -ge 6 ] && return 1
            local m=$(( 10#$(date -u +%H)*60 + 10#$(date -u +%M) ))
            [ $m -lt 405 ] || { [ $m -ge 810 ] && [ $m -lt 1335 ]; }
          }
          n=0
          while [ $(date +%s) -lt $DEADLINE ]; do
            if inwin; then python3 hourly_price_update.py 2>&1 | tail -4 || true; n=$((n+1)); fi
            sleep $(( 600 - $(date -u +%s) % 600 ))
          done
          echo "갱신 ${n}회 — 다음 run 으로 넘김"
      - name: next relay run
        if: success() || failure()
        env:
          GH_PAT: ${{ secrets.SV_PAT }}
        run: |
          curl -fsS -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/price-update.yml/dispatches" \
            -d '{"ref":"main"}' && echo "다음 run 발동"

name: dart-collect
# 평일 09:10 · 13:10 · 18:10 KST — 관심기업 공시(DART·SEC EDGAR·TDnet) → dart-monitoring/data/disclosures.json
on:
  schedule:
    - cron: '10 0,4,9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dart-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: collect
        id: c
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: |
          python dart_collect.py | tee out.log
          if grep -q "✓ 커밋" out.log; then echo "pushed=1" >> "$GITHUB_OUTPUT"; fi
      - name: rebuild pages (dart-monitoring)
        if: steps.c.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh api -X POST repos/whysosary-dot/dart-monitoring/pages/builds || true

name: sv-hourly
# 평일 09~16시 KST 매시 — 주가·시총·등락률만 (차트 이력 제외) → invest-private sv/stocks.json
on:
  schedule:
    - cron: '5 0-7 * * 1-5'   # 09:05~16:05 KST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sv-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance flask flask-cors
      - env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TZ: Asia/Seoul
        run: python hourly_price_update.py

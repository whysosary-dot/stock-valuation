name: report-collect
# 월~토 07:20 KST — FnGuide WiseReport 리포트서머리(기업·산업) 최근 5개 발간일 → report/data/*.json
on:
  schedule:
    - cron: '20 22 * * 0-5'   # 07:20 KST 월~토
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: report-collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Seoul
        run: python report_collect.py
      - name: rebuild pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true

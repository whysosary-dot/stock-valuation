<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Schedule (2026-11-10 체크리스트 재설계) — 시간표가 아니라 '틈틈이 해치우는' 체크리스트
   오늘(체크리스트) · 주(루틴 × 7일 점 표) · 월(달성률 달력) · 관리(루틴 목록)
   데이터: invest-private sv/schedule.json · 로컬 sv_schedule_v1 · 저장은 대시보드 ☁️ 커밋 & 푸시
   호환: 기존 items(kind/days/doms/date/start/end/color/note) 그대로 사용. 추가 필드 slot(아침/낮/저녁/밤/any), times(유연 루틴 주·월 n회) ── */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f0f2f6; --line:#e4e7ee; --line-2:#eef0f5;
  --fg:#161a22; --fg-2:#596273; --fg-3:#8b93a4;
  --accent:#2e5bff; --accent-soft:#e8edff; --accent-ink:#1d3fd6;
  --ok:#16a34a; --ok-soft:#e6f6ea; --warn:#b45309; --warn-soft:#fff4e0;
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0f1217; --surface:#161a21; --surface-2:#1c212a; --line:#262c37; --line-2:#20252e; --fg:#e8ebf1; --fg-2:#a4abba; --fg-3:#6f7788; --accent:#6b8cff; --accent-soft:#1d2744; --accent-ink:#9db0ff; --ok-soft:#153324; --warn-soft:#3a2a10; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0f1217; --surface:#161a21; --surface-2:#1c212a; --line:#262c37; --line-2:#20252e; --fg:#e8ebf1; --fg-2:#a4abba; --fg-3:#6f7788; --accent:#6b8cff; --accent-soft:#1d2744; --accent-ink:#9db0ff; --ok-soft:#153324; --warn-soft:#3a2a10; color-scheme:dark }
*{ box-sizing:border-box }
html,body{ height:100%; margin:0 }
body{ font-family:var(--font); font-size:14px; color:var(--fg); background:var(--bg); -webkit-font-smoothing:antialiased; letter-spacing:-.005em }
button,input,select,textarea{ font:inherit; color:inherit }
button{ cursor:pointer }
.app{ min-height:100%; display:flex; flex-direction:column }
/* 상단 바 */
.top{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface) }
.top .brand{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; margin-right:4px }
.top .brand i{ width:22px; height:22px; border-radius:6px; background:var(--accent); color:#fff; display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:700; font-family:var(--mono) }
.ib{ height:32px; min-width:32px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--fg-2); display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:500; font-size:13px; white-space:nowrap }
.ib:hover{ background:var(--surface-2); color:var(--fg) }
.ib.pri{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
.ib.pri:hover{ background:var(--accent-ink) }
.seg{ display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px }
.seg button{ border:none; background:none; padding:0 12px; height:26px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--fg-2) }
.seg button.on{ background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08) }
.sp{ flex:1 }
.badge{ font-size:11px; font-weight:600; color:var(--warn); background:var(--warn-soft); border:1px solid #fcd9a6; border-radius:999px; padding:3px 9px; display:none }
.badge.on{ display:inline-block }
/* 본문 */
.main{ flex:1; width:100%; max-width:760px; margin:0 auto; padding:14px 16px 90px }
.dateh{ display:flex; align-items:center; gap:8px; margin:2px 0 12px }
.dateh .ttl{ font-size:20px; font-weight:700; letter-spacing:-.01em }
.dateh .ttl small{ font-size:12.5px; color:var(--fg-3); font-weight:500; margin-left:8px }
.dateh .nav{ margin-left:auto; display:flex; gap:4px }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:12px }
/* 진행 */
.prog{ display:flex; align-items:center; gap:14px; padding:14px 16px }
.prog .ring{ width:54px; height:54px; border-radius:50%; background:conic-gradient(var(--ok) var(--p,0%), var(--line) 0); display:grid; place-items:center; flex:none; transition:background .3s }
.prog .ring i{ width:42px; height:42px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-style:normal; font-size:12px; font-weight:700; font-family:var(--mono) }
.prog b{ display:block; font-size:15px; font-weight:700 }
.prog span{ font-size:12px; color:var(--fg-2); display:block; margin-top:2px }
.prog .all{ margin-left:auto; text-align:right; font-size:12px; color:var(--fg-3) }
/* 체크리스트 */
.sec{ padding:10px 14px 4px; font-size:11px; font-weight:700; color:var(--fg-3); letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; gap:8px; background:var(--surface-2); border-top:1px solid var(--line-2); border-bottom:1px solid var(--line-2) }
.sec:first-child{ border-top:none }
.sec .cnt{ font-family:var(--mono); font-weight:500; color:var(--fg-3) }
.row{ display:grid; grid-template-columns:30px 1fr auto; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line-2); cursor:pointer; -webkit-tap-highlight-color:transparent; transition:background .12s }
.row:last-child{ border-bottom:none }
.row:hover{ background:var(--surface-2) }
.row .ck{ width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:14px; color:#fff; background:var(--surface); transition:all .15s }
.row .ck::after{ content:""; width:10px; height:10px; border-radius:50%; background:var(--c,var(--accent)); opacity:.35 }
.row.done .ck{ background:var(--ok); border-color:var(--ok) } .row.done .ck::after{ display:none }
.row.done .ck::before{ content:"✓"; font-weight:700 }
.row .nm{ min-width:0 }
.row .ti{ font-weight:600; font-size:14.5px; line-height:1.3; word-break:keep-all }
.row.done .ti{ text-decoration:line-through; color:var(--fg-3); font-weight:500 }
.row .sub{ font-size:12px; color:var(--fg-2); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center }
.row .sub .tag{ font-size:10.5px; font-weight:600; color:var(--fg-3); background:var(--surface-2); border-radius:5px; padding:1px 6px; font-family:var(--mono) }
.row .sub .tag.q{ color:var(--accent-ink); background:var(--accent-soft) }
.row .sub .tag.late{ color:var(--warn); background:var(--warn-soft) }
.row .sub .note{ color:var(--fg-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100% }
.row .r{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--fg-3); font-family:var(--mono); white-space:nowrap }
.row .r .st{ color:var(--warn); font-weight:700 }
.row .r .ed{ border:none; background:none; color:var(--fg-3); width:26px; height:26px; border-radius:6px; font-size:13px; display:grid; place-items:center }
.row .r .ed:hover{ background:var(--line) }
.row.ghost{ opacity:.55 }
.empty{ padding:34px 16px; text-align:center; color:var(--fg-3); font-size:13px; line-height:1.7 }
.empty b{ color:var(--fg-2) }
/* 주간 점 표 */
.wk{ overflow:auto }
.wk table{ width:100%; border-collapse:collapse; font-size:13px }
.wk th{ font-size:11px; font-weight:600; color:var(--fg-3); padding:10px 4px 8px; text-align:center; border-bottom:1px solid var(--line); background:var(--surface) }
.wk th:first-child{ text-align:left; padding-left:14px; width:40% }
.wk th .n{ display:block; font-size:15px; color:var(--fg); font-weight:600; margin-top:1px; width:28px; height:28px; line-height:28px; border-radius:50%; margin-inline:auto; font-variant-numeric:tabular-nums }
.wk th.today .n{ background:var(--accent); color:#fff }
.wk th.sun{ color:#dc2626 } .wk th.sat{ color:#2563eb }
.wk td{ padding:8px 4px; text-align:center; border-bottom:1px solid var(--line-2) }
.wk td:first-child{ text-align:left; padding-left:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:0 }
.wk td:first-child i{ display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:7px; vertical-align:1px }
.wk td:first-child small{ display:block; font-size:10.5px; color:var(--fg-3); font-weight:500; font-family:var(--mono) }
.wk .dot{ width:24px; height:24px; border-radius:50%; border:none; background:var(--surface-2); display:inline-grid; place-items:center; font-size:12px; color:#fff; padding:0 }
.wk .dot.na{ background:transparent; cursor:default }
.wk .dot.due{ box-shadow:inset 0 0 0 1.5px var(--line) }
.wk .dot.on{ background:var(--ok) }
.wk .dot.miss{ background:var(--surface-2); box-shadow:inset 0 0 0 1.5px #fca5a5 }
.wk .dot.fut{ background:transparent; box-shadow:inset 0 0 0 1.5px var(--line-2); cursor:default }
.wk tr.sum td{ background:var(--surface-2); font-family:var(--mono); font-size:11.5px; color:var(--fg-2); font-weight:600 }
/* 월간 */
.mo .head{ display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line) }
.mo .head div{ padding:8px 0 6px; font-size:11px; font-weight:600; color:var(--fg-3); text-align:center }
.mo .head div:first-child{ color:#dc2626 } .mo .head div:last-child{ color:#2563eb }
.mo .cells{ display:grid; grid-template-columns:repeat(7,1fr) }
.mo .c{ aspect-ratio:1/1.05; border-right:1px solid var(--line-2); border-bottom:1px solid var(--line-2); padding:5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative }
.mo .c:nth-child(7n){ border-right:none }
.mo .c:hover{ background:var(--surface-2) }
.mo .c.out{ opacity:.35 }
.mo .c .n{ font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; width:24px; height:24px; display:grid; place-items:center; border-radius:50% }
.mo .c.today .n{ background:var(--accent); color:#fff }
.mo .c.sel{ box-shadow:inset 0 0 0 2px var(--accent) }
.mo .c .ring{ width:30px; height:30px; border-radius:50%; background:conic-gradient(var(--ok) var(--p,0%), var(--line) 0); display:grid; place-items:center }
.mo .c .ring i{ width:21px; height:21px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-style:normal; font-size:9px; font-family:var(--mono); color:var(--fg-2) }
.mo .c .ring.full i{ background:var(--ok); color:#fff; font-size:10px }
.mo .c .ev{ position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--accent) }
.mo .foot{ padding:10px 14px; font-size:12px; color:var(--fg-2); border-top:1px solid var(--line); display:flex; gap:14px; flex-wrap:wrap }
.mo .foot b{ color:var(--fg); font-family:var(--mono) }
/* 관리 */
.mg .row{ grid-template-columns:14px 1fr auto }
.mg .row .sw{ width:12px; height:12px; border-radius:4px }
.mg .row .ti{ font-size:14px }
.hint{ font-size:12px; color:var(--fg-3); padding:10px 14px 12px; line-height:1.6 }
/* 만다라트 (오타니 식 9×9) */
.mdl{ padding:12px }
.mdl .tools{ display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap }
.mdl .tools .ib.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink) }
.m9{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px }
.m3{ display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:4px; border-radius:10px; background:var(--surface-2) }
.m3.hub{ background:var(--accent-soft) }
.mc{ aspect-ratio:1/1; border-radius:7px; background:var(--surface); border:1px solid var(--line-2); padding:4px 3px; font-size:10.5px; line-height:1.25; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; word-break:keep-all; overflow:hidden; position:relative; user-select:none; -webkit-tap-highlight-color:transparent; transition:transform .08s }
.mc:hover{ border-color:var(--fg-3) }
.mc:active{ transform:scale(.96) }
.mc .t{ font-weight:600; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; color:var(--fg) }
.mc.empty .t{ color:var(--fg-3); font-weight:500 }
.mc.goal{ background:var(--accent); border-color:var(--accent); color:#fff; font-size:11px } .mc.goal .t{ color:#fff; font-weight:700; -webkit-line-clamp:4 }
.m3[data-b]{ background:color-mix(in srgb, var(--pb) 55%, var(--surface-2)) }
.m3[data-b] .mc{ background:color-mix(in srgb, var(--pb) 22%, var(--surface)); border-color:color-mix(in srgb, var(--pb) 70%, var(--line)) }
.m3[data-b] .mc.ref{ background:var(--surface) }
.mc.sub{ background:var(--pb,var(--accent-soft)); border-color:transparent } .mc.sub .t{ color:var(--pi,var(--accent-ink)); font-weight:700 }
.m3.hub .mc.sub{ background:var(--pb); border-color:color-mix(in srgb, var(--pi) 25%, transparent) }
.m3.hub .mc.sub .k{ color:var(--pi); opacity:.8 }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .m3[data-b]{ background:color-mix(in srgb, var(--pb) 18%, var(--surface-2)) } :root:not([data-theme="light"]) .m3[data-b] .mc{ background:color-mix(in srgb, var(--pb) 8%, var(--surface)) } :root:not([data-theme="light"]) .mc.sub,:root:not([data-theme="light"]) .m3.hub .mc.sub{ background:color-mix(in srgb, var(--pb) 35%, var(--surface)) } :root:not([data-theme="light"]) .mc.sub .t{ color:color-mix(in srgb, var(--pb) 80%, #fff) } }
.mc.ref{ border-left:3px solid var(--c,var(--accent)) }
.mc.ref.on{ background:var(--ok-soft); border-color:var(--ok) } .mc.ref.on .t{ color:var(--ok); text-decoration:line-through; text-decoration-thickness:1px }
.mc .k{ font-size:9px; color:var(--fg-3); font-family:var(--mono); line-height:1 }
.mc.ref.on .k{ color:var(--ok) }
.mc .chk{ position:absolute; top:2px; right:3px; font-size:9px; color:var(--ok); font-weight:700 }
.mdl .foot{ margin-top:10px; font-size:12px; color:var(--fg-2); display:flex; gap:14px; flex-wrap:wrap } .mdl .foot b{ font-family:var(--mono); color:var(--fg) }
.mdl .back{ margin-bottom:8px }
@media (max-width:640px){ .mdl .m9{ gap:4px } .mdl .m3{ gap:2px; padding:3px } .mc{ font-size:9px; padding:2px } .mc .k,.mc .chk{ display:none } .mdl.zoom .mc{ font-size:13px; padding:6px } .mdl.zoom .mc .k,.mdl.zoom .mc .chk{ display:block } .mdl.zoom .mc .chk{ display:inline } .mdl.zoom .mc.goal{ font-size:14px } }
.mdl.zoom .m3{ gap:6px; padding:6px } .mdl.zoom .mc{ font-size:13px; padding:8px 6px } .mdl.zoom .mc .t{ -webkit-line-clamp:4 }
/* 드래그 이동 */
.mc{ touch-action:pan-y; -webkit-touch-callout:none; -webkit-user-select:none }
.mc.dragsrc{ opacity:.35 }
.mc.dropok{ outline:2px dashed var(--accent); outline-offset:-2px; transform:scale(1.04) }
.mghost{ position:fixed; z-index:70; pointer-events:none; width:84px; height:84px; border-radius:9px; background:var(--surface); border:1px solid var(--accent); box-shadow:0 10px 28px rgba(0,0,0,.25); padding:6px; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; text-align:center; transform:translate(-50%,-50%) rotate(-2deg); word-break:keep-all; overflow:hidden; opacity:.95 }
/* 셀 편집 */
.mv .hd textarea{ flex:1; border:none; background:none; font-size:17px; font-weight:600; outline:none; min-width:0; resize:none; line-height:1.35; font-family:inherit; padding:0 } .mv .hd textarea::placeholder{ color:var(--fg-3); font-weight:500; font-size:14px }
.mc .t{ white-space:pre-line }
.mv .sel{ width:100%; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface) }
/* 플로팅 추가 */
.fab{ position:fixed; right:18px; bottom:22px; height:44px; padding:0 18px 0 14px; border-radius:999px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; box-shadow:0 8px 24px rgba(46,91,255,.35); display:inline-flex; align-items:center; gap:6px; z-index:15 }
.fab:hover{ background:var(--accent-ink) }
/* 모달 */
.ov{ position:fixed; inset:0; background:rgba(10,14,22,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:12px }
.ov.on{ display:flex }
.md{ background:var(--surface); border-radius:16px; width:min(540px,100%); max-height:94vh; overflow:auto; box-shadow:0 24px 70px rgba(0,0,0,.35) }
.md .hd{ padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px }
.md .hd input{ flex:1; border:none; background:none; font-size:17px; font-weight:600; outline:none; min-width:0 }
.md .hd input::placeholder{ color:var(--fg-3); font-weight:500 }
.md .bd{ padding:14px 18px; display:grid; gap:14px }
.f label{ display:block; font-size:11px; color:var(--fg-3); font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px }
.f input[type=text],.f input[type=date],.f input[type=number],.f textarea{ width:100%; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface) }
.f input:focus,.f textarea:focus{ outline:2px solid var(--accent-soft); border-color:var(--accent) }
.f textarea{ min-height:58px; resize:vertical }
.pills{ display:flex; gap:5px; flex-wrap:wrap }
.pills button{ border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:600; color:var(--fg-2) }
.pills button.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink) }
.pills.days button{ width:40px; padding:7px 0; text-align:center }
.sw-row{ display:flex; gap:7px; flex-wrap:wrap }
.sw-row button{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; padding:0 }
.sw-row button.on{ outline:2px solid var(--fg); outline-offset:2px }
.tog{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--fg-2); cursor:pointer; user-select:none }
.tog i{ width:34px; height:20px; border-radius:999px; background:var(--line); position:relative; transition:background .15s; flex:none }
.tog i::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2) }
.tog.on i{ background:var(--accent) } .tog.on i::after{ left:16px }
.times{ display:flex; align-items:center; gap:8px; font-size:13px }
.f .times input{ width:76px; flex:none }
.md .ft{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center }
.md .ft .del{ margin-right:auto; color:#dc2626 }
.toast{ position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:#1b2030; color:#fff; font-size:12.5px; padding:9px 16px; border-radius:999px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60 }
.toast.on{ opacity:1 }
@media (max-width:640px){
  .top{ padding:8px 10px; gap:6px; flex-wrap:wrap }
  .top .brand span{ display:none }
  .top .badge{ order:9; flex-basis:100%; text-align:center }
  .main{ padding:12px 10px 90px }
  .dateh .ttl{ font-size:18px }
  .row{ padding:11px 12px; gap:10px }
  .wk th:first-child,.wk td:first-child{ padding-left:10px }
  .wk .dot{ width:22px; height:22px }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i>S</i><span>Schedule</span></div>
    <div class="seg" id="views"><button data-v="today">오늘</button><button data-v="week">주</button><button data-v="month">월</button><button data-v="mandala">만다라트</button><button data-v="manage">관리</button></div>
    <div class="sp"></div>

  <div class="hd"><span id="fSw" style="width:14px;height:14px;border-radius:4px;flex:none"></span><input type="text" id="fTitle" placeholder="할 일 제목"></div>

    <div class="f"><label>종류</label><div class="pills" id="fKind"><button data-k="once">한 번 (날짜)</button><button data-k="daily">매일</button><button data-k="weekly">매주</button><button data-k="monthly">매월</button></div></div>

    <div class="f" id="fFlexWrap"><div class="tog" id="fFlex"><i></i><span id="fFlexLab">요일 상관없이 — 주 N회만 채우면 됨</span></div></div>
    <div class="f" id="fTimesWrap"><label>횟수</label><div class="times"><input type="number" id="fTimes" min="1" max="31" value="1"><span id="fTimesLab">회 / 주</span></div></div>

    <div class="f"><label>시간대 (참고용 — 체크는 언제든)</label><div class="pills" id="fSlot"><button data-s="any">아무 때나</button><button data-s="am">아침</button><button data-s="day">낮</button><button data-s="pm">저녁</button><button data-s="night">밤</button></div></div>

  </div>

  <div class="hd"><span id="mvKind" style="font-size:11px;font-weight:700;color:var(--fg-3);letter-spacing:.05em"></span><textarea id="mvText" rows="2" placeholder="내용 — 엔터로 줄바꿈, ⌘/Ctrl+엔터로 저장"></textarea></div>
  <div class="bd">
    <div class="f" id="mvRefWrap"><label>루틴 연결 — 연결하면 칸을 눌러 오늘 체크, 진행이 색으로 보입니다</label><select class="sel" id="mvRef"></select></div>
    <div class="f" id="mvNewWrap" style="display:none"><label>새 루틴 종류</label><div class="pills" id="mvNewKind"><button data-k="daily" class="on">매일</button><button data-k="w3">주 3회</button><button data-k="w5">주 5회</button><button data-k="m1">월 1회</button></div></div>
  </div>
  <div class="ft"><button class="ib del" id="mvClear">비우기</button><button class="ib" id="mvCancel">취소</button><button class="ib pri" id="mvSave">저장</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ───────── 저장소 ───────── */
const LS='sv_schedule_v1', LS_DIRTY='sv_schedule_dirty', GH={owner:'whysosary-dot',repo:'invest-private',path:'sv/schedule.json'};
const $=(s,r=document)=>r.querySelector(s);
const COLORS=['#2e5bff','#7c3aed','#db2777','#e11d48','#ea580c','#d97706','#16a34a','#0d9488','#0284c7','#64748b'];
const DAYS=['일','월','화','수','목','금','토'];
const SLOT={any:'',am:'아침',day:'낮',pm:'저녁',night:'밤'};
let S=load(), view='today', cur=today(), sel=ymd(today());
try{ const v=localStorage.getItem('sv_schedule_view2'); if(v) view=v; }catch(_){}

function seed(){ return { items:[
  {id:'r2',title:'미국장 브리핑 · 어제 복기',kind:'daily',slot:'am',color:'#2e5bff',note:'Market 탭 US 브리핑 → 보유 종목 뉴스 → 오늘 볼 것 메모'},
  {id:'r3',title:'장중 시초가 매매 안 하기',kind:'daily',days:[1,2,3,4,5],slot:'day',color:'#e11d48'},
  {id:'r4',title:'마감 복기 · 스크리너 실적 읽기',kind:'daily',days:[1,2,3,4,5],slot:'pm',color:'#7c3aed'},
  {id:'r6',title:'투자 일기 쓰기',kind:'daily',slot:'night',color:'#0d9488',note:'Diary 탭 — 오늘 판단·감정·규칙 위반 여부'},
  {id:'r5',title:'독서 30분',kind:'weekly',days:[],times:3,color:'#16a34a'},
  {id:'r1',title:'스트레칭',kind:'weekly',days:[],times:4,color:'#ea580c'},
  {id:'r7',title:'주간 포트 점검 · 조언 읽기',kind:'weekly',days:[0],color:'#d97706'},
  {id:'r8',title:'월간 포트 스냅샷 · 리밸런싱 검토',kind:'monthly',doms:[],times:1,color:'#db2777'},
], done:{}, updatedAt:0, _seed:true }; }
function load(){ try{ const j=JSON.parse(localStorage.getItem(LS)||'null'); if(j&&Array.isArray(j.items)){ j.done=j.done||{}; return j; } }catch(_){} return seed(); }
function save(){ S.updatedAt=Date.now(); delete S._seed; try{ localStorage.setItem(LS,JSON.stringify(S)); localStorage.setItem(LS_DIRTY,'1'); }catch(_){} dirty(); }
function dirty(){ let d=false; try{ d=localStorage.getItem(LS_DIRTY)==='1'; }catch(_){} $('#dirty').classList.toggle('on',d); }
async function pull(){
  let pat=''; try{ pat=(localStorage.getItem('sv_github_pat')||'').trim(); }catch(_){} if(!pat) return;
  try{ const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=main&t=${Date.now()}`,{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json',Authorization:'token '+pat}});
    if(!r.ok) return; const g=await r.json(); if(!g||!Array.isArray(g.items)) return;
    let d=false; try{ d=localStorage.getItem(LS_DIRTY)==='1'; }catch(_){}
    if(((g.updatedAt||0)>(S.updatedAt||0) && !d) || S._seed){ S=g; S.done=S.done||{}; try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(_){} render(); return; }
    // 로컬에 미커밋 변경이 있어도, 원격에만 있는 루틴과 만다라트는 가져온다(덮어쓰기 방지용 병합)
    // 원격의 초기화 지시(tomb): 지정된 루틴 삭제 + 만다라트를 원격 것으로 교체 (한 번만 적용)
    if(g.tomb&&(g.tomb.ts||0)>(S.tombTs||0)){ const rm=new Set(g.tomb.items||[]); S.items=S.items.filter(i=>!rm.has(i.id)); Object.values(S.done).forEach(o=>rm.forEach(id=>delete o[id])); if(g.tomb.mandala) S.mandala=g.mandala; S.tombTs=g.tomb.ts; try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(_){} render(); toast('GitHub 기준으로 정리했습니다'); return; }
    if((g.updatedAt||0)>(S.updatedAt||0)){ let ch=false; const ids=new Set(S.items.map(i=>i.id)); (g.items||[]).forEach(i=>{ if(!ids.has(i.id)){ S.items.push(i); ch=true; } });
      const emptyM=!S.mandala||(!S.mandala.goal&&(S.mandala.subs||[]).every(b=>!b.title&&(b.cells||[]).every(c=>!c.text&&!c.ref)));
      const localGoal=S.mandala&&S.mandala.goal; const remoteFilled=g.mandala&&(g.mandala.subs||[]).some(b=>b.title);
      if(remoteFilled&&(emptyM||!(S.mandala.subs||[]).some(b=>b.title))){ const keep=localGoal; S.mandala=g.mandala; if(keep&&!S.mandala.goal) S.mandala.goal=keep; ch=true; }
      if(ch){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(_){} render(); toast('GitHub의 새 루틴·만다라트를 가져왔습니다'); } }
  }catch(_){}
}
window.addEventListener('message',e=>{ if(e.origin===location.origin&&e.data&&e.data.type==='sv-schedule-synced'){ try{ S=JSON.parse(localStorage.getItem(LS)||'null')||S; }catch(_){} dirty(); toast('GitHub에 저장됨'); } });

/* ───────── 날짜 ───────── */
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); return x; }   // 일요일 시작
function lastDom(d){ return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); }
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 유연 루틴: weekly 인데 요일 없음 → 주 times회 / monthly 인데 날짜 없음 → 월 times회 */
function isFlex(it){ return (it.kind==='weekly'&&!(it.days||[]).length)||(it.kind==='monthly'&&!(it.doms||[]).length); }
function times(it){ return Math.max(1,parseInt(it.times,10)||1); }
function slotOf(it){ if(it.slot&&it.slot!=='any') return it.slot; if(it.start){ const h=parseInt(it.start,10); return h<11?'am':h<17?'day':h<21?'pm':'night'; } return 'any'; }
function occurs(it,d){ const w=d.getDay(), dom=d.getDate();
  if(it.kind==='daily') return !(it.days&&it.days.length)||it.days.includes(w);
  if(it.kind==='weekly') return isFlex(it)||(it.days||[]).includes(w);
  if(it.kind==='monthly') return isFlex(it)||(it.doms||[]).some(x=>x==='last'?dom===lastDom(d):x===dom);
  return it.date===ymd(d); }
function isDone(id,ds){ return !!(S.done[ds]&&S.done[ds][id]); }
function periodDays(it,d){ // 유연 루틴의 기간(주/월) 날짜 목록
  if(it.kind==='weekly'){ const a=weekStart(d); return [...Array(7)].map((_,i)=>addDays(a,i)); }
  const n=lastDom(d); return [...Array(n)].map((_,i)=>new Date(d.getFullYear(),d.getMonth(),i+1)); }
function flexCount(it,d){ return periodDays(it,d).filter(x=>isDone(it.id,ymd(x))).length; }
function quotaMet(it,d){ return flexCount(it,d)>=times(it); }
/* 그 날의 '해야 할 것'으로 셈하는지: 고정 루틴은 occurs, 유연 루틴은 (그날 체크했거나) 아직 횟수를 못 채운 경우 */
function dueOn(it,d){ if(!occurs(it,d)) return false; if(!isFlex(it)) return true; return isDone(it.id,ymd(d))||!quotaMet(it,d); }
function doneEff(it,d){ return isDone(it.id,ymd(d))||(isFlex(it)&&quotaMet(it,d)); }
function itemsOn(d){ return S.items.filter(it=>occurs(it,d)); }
function dayStat(d){ const its=itemsOn(d).filter(it=>dueOn(it,d)||isDone(it.id,ymd(d))); const dn=its.filter(it=>doneEff(it,d)).length; return {n:its.length,dn,p:its.length?Math.round(dn/its.length*100):0}; }
function toggle(id,ds){ S.done[ds]=S.done[ds]||{}; if(S.done[ds][id]) delete S.done[ds][id]; else S.done[ds][id]=1; if(!Object.keys(S.done[ds]).length) delete S.done[ds]; save(); render(); }
function streak(it){ if(it.kind==='once'||isFlex(it)) return 0; let n=0,d=today(); if(!isDone(it.id,ymd(d))) d=addDays(d,-1); for(let i=0;i<400;i++){ if(!occurs(it,d)){ d=addDays(d,-1); continue; } if(isDone(it.id,ymd(d))) n++; else break; d=addDays(d,-1); } return n; }
function kindLabel(it){
  if(it.kind==='once') return it.date;
  if(it.kind==='daily') return (it.days&&it.days.length&&it.days.length<7)?(it.days||[]).map(d=>DAYS[d]).join(''):'매일';
  if(it.kind==='weekly') return isFlex(it)?`주 ${times(it)}회`:(it.days||[]).map(d=>DAYS[d]).join('')+'요일';
  return isFlex(it)?`월 ${times(it)}회`:'매월 '+(it.doms||[]).map(x=>x==='last'?'말일':x+'일').join(','); }

/* ───────── 렌더 ───────── */
function render(){
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  dirty(); const m=$('#main'); m.innerHTML='';
  if(view==='today') renderToday(m); else if(view==='week') renderWeek(m); else if(view==='month') renderMonth(m); else if(view==='mandala') renderMandala(m); else renderManage(m);
}
function dateHead(root,title,sub,nav){
  const h=document.createElement('div'); h.className='dateh';
  h.innerHTML=`<div class="ttl">${title}${sub?`<small>${sub}</small>`:''}</div>${nav?`<div class="nav"><button class="ib" id="prev">‹</button><button class="ib" id="next">›</button></div>`:''}`;
  root.appendChild(h); if(nav){ $('#prev').onclick=()=>nav(-1); $('#next').onclick=()=>nav(1); }
}
function rowHtml(it,d,opts={}){
  const ds=ymd(d), chk=isDone(it.id,ds), eff=doneEff(it,d), st=streak(it), sl=SLOT[slotOf(it)];
  const tags=[];
  if(isFlex(it)){ const c=flexCount(it,d), t=times(it); tags.push(`<span class="tag q">${it.kind==='weekly'?'이번 주':'이번 달'} ${c}/${t}</span>`); }
  else if(it.kind==='once') tags.push(`<span class="tag">일정</span>`);
  if(sl) tags.push(`<span class="tag">${sl}</span>`);
  if(opts.late) tags.push(`<span class="tag late">${opts.late}</span>`);
  return `<div class="row ${chk?'done':''} ${(!chk&&eff)?'ghost':''}" data-id="${it.id}" data-ds="${ds}" style="--c:${it.color}">
    <span class="ck"></span>
    <span class="nm"><div class="ti">${esc(it.title)}</div><div class="sub">${tags.join('')}${it.note?`<span class="note">${esc(it.note)}</span>`:''}</div></span>
    <span class="r">${st>1?`<span class="st">${st}일째</span>`:''}<button class="ed" data-ed="${it.id}" title="수정">✎</button></span></div>`; }
function bindRows(root){ root.querySelectorAll('.row').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('.ed')) openEdit(el.dataset.id); else toggle(el.dataset.id,el.dataset.ds); })); }
function renderToday(root){
  const t=today(), d=cur, ds=ymd(d), diff=Math.round((d-t)/864e5);
  dateHead(root,`${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`,diff===0?'오늘':diff===1?'내일':diff===-1?'어제':(diff>0?'+':'')+diff+'일',dir=>{ cur=addDays(cur,dir); sel=ymd(cur); render(); });
  const st=dayStat(d);
  const prog=document.createElement('div'); prog.className='card';
  const best=S.items.map(i=>({i,s:streak(i)})).sort((a,b)=>b.s-a.s)[0];
  const flexLeft=S.items.filter(i=>isFlex(i)&&occurs(i,d)&&!quotaMet(i,d)).length;
  prog.innerHTML=`<div class="prog"><div class="ring" style="--p:${st.p}%"><i>${st.p}%</i></div><div><b>${st.dn} / ${st.n} 완료</b><span>${st.n&&st.dn===st.n?'오늘 할 일을 다 했습니다':flexLeft?`틈날 때 하나씩 — 유연 루틴 ${flexLeft}개 남음`:'틈날 때 하나씩 체크하세요'}</span></div><div class="all">${best&&best.s>1?`${best.s}일 연속<br>${esc(best.i.title)}`:''}</div></div>`;
  root.appendChild(prog);
  const card=document.createElement('div'); card.className='card';
  const all=itemsOn(d).filter(it=>dueOn(it,d)||isDone(it.id,ds));
  const once=all.filter(i=>i.kind==='once'), fixed=all.filter(i=>i.kind!=='once'&&!isFlex(i)), flex=all.filter(i=>isFlex(i));
  const open=x=>x.filter(i=>!isDone(i.id,ds)), closed=x=>x.filter(i=>isDone(i.id,ds));
  // 지난 미완(이번 주 유연 루틴은 자체 카운트가 있으니 제외) — 최근 7일 내 '한 번' 일정 중 안 한 것
  const late=diff===0?S.items.filter(i=>i.kind==='once'&&i.date<ds&&i.date>=ymd(addDays(t,-7))&&!isDone(i.id,i.date)):[];
  let h='';
  const sec=(name,arr,dd,extra)=>{ if(!arr.length) return ''; return `<div class="sec">${name}<span class="cnt">${arr.length}</span></div>`+arr.map(i=>rowHtml(i,dd||d,extra)).join(''); };
  h+=sec('일정',open(once)); h+=sec('오늘 루틴',open(fixed)); h+=sec('틈틈이 (이번 주·이번 달 횟수)',open(flex));
  late.forEach(i=>{ h+=`<div class="sec">밀린 일정</div>`+rowHtml(i,parse(i.date),{late:i.date.slice(5).replace('-','/')+' 미완'}); });
  const dn=closed(all); if(dn.length) h+=`<div class="sec">완료<span class="cnt">${dn.length}</span></div>`+dn.map(i=>rowHtml(i,d)).join('');
  card.innerHTML=h||`<div class="empty"><b>할 일이 없습니다</b><br>＋ 추가로 루틴이나 일정을 만드세요</div>`;
  root.appendChild(card); bindRows(card);
  const tip=document.createElement('div'); tip.className='hint'; tip.textContent='행을 누르면 체크 · ✎ 로 수정. 흐린 행은 이번 주·달 횟수를 이미 채운 루틴(더 해도 됩니다).'; root.appendChild(tip);
}
function renderWeek(root){
  const a=weekStart(cur), days=[...Array(7)].map((_,i)=>addDays(a,i)), t=today(), ts=ymd(t);
  dateHead(root,`${a.getFullYear()}년 ${a.getMonth()+1}월`,`${a.getMonth()+1}.${a.getDate()} – ${days[6].getMonth()+1}.${days[6].getDate()}`,dir=>{ cur=addDays(cur,7*dir); sel=ymd(cur); render(); });
  const rs=S.items.filter(i=>i.kind!=='once'&&days.some(d=>occurs(i,d))).sort((x,y)=>(isFlex(x)?1:0)-(isFlex(y)?1:0));
  const ev=S.items.filter(i=>i.kind==='once'&&days.some(d=>i.date===ymd(d)));
  const card=document.createElement('div'); card.className='card wk';
  let h=`<table><thead><tr><th>루틴</th>${days.map(d=>`<th class="${ymd(d)===ts?'today':''} ${d.getDay()===0?'sun':d.getDay()===6?'sat':''}">${DAYS[d.getDay()]}<span class="n">${d.getDate()}</span></th>`).join('')}</tr></thead><tbody>`;
  const cell=(it,d)=>{ const ds=ymd(d); if(!occurs(it,d)) return `<td><button class="dot na"></button></td>`; const on=isDone(it.id,ds), fut=d>t;
    const cls=on?'on':fut?'fut':(isFlex(it)?'due':(d<t?'miss':'due')); return `<td><button class="dot ${cls}" data-id="${it.id}" data-ds="${ds}" ${fut?'disabled':''}>${on?'✓':''}</button></td>`; };
  rs.forEach(it=>{ const sub=isFlex(it)?`${flexCount(it,a)}/${times(it)} ${it.kind==='weekly'?'이번 주':'이번 달'}`:kindLabel(it);
    h+=`<tr><td><i style="background:${it.color}"></i>${esc(it.title)}<small>${sub}</small></td>${days.map(d=>cell(it,d)).join('')}</tr>`; });
  ev.forEach(it=>{ h+=`<tr><td><i style="background:${it.color}"></i>${esc(it.title)}<small>일정 ${it.date.slice(5)}</small></td>${days.map(d=>cell(it,d)).join('')}</tr>`; });
  h+=`<tr class="sum"><td>달성률</td>${days.map(d=>{ const s=dayStat(d); return `<td>${d>t?'·':s.n?s.p+'%':'–'}</td>`; }).join('')}</tr></tbody></table>`;
  card.innerHTML=h; root.appendChild(card);
  card.querySelectorAll('.dot[data-id]').forEach(b=>b.onclick=()=>toggle(b.dataset.id,b.dataset.ds));
  const tip=document.createElement('div'); tip.className='hint'; tip.textContent='점을 눌러 지난 날짜도 체크할 수 있습니다. 빨간 테두리 = 놓친 날, 유연 루틴은 주·월 횟수만 채우면 됩니다.'; root.appendChild(tip);
}
function renderMonth(root){
  const y=cur.getFullYear(), m=cur.getMonth(), first=new Date(y,m,1), start=addDays(first,-first.getDay()), t=today(), ts=ymd(t);
  dateHead(root,`${y}년 ${m+1}월`,'',dir=>{ cur=new Date(y,m+dir,1); sel=ymd(cur); render(); });
  const rows=Math.ceil((first.getDay()+lastDom(first))/7);
  const card=document.createElement('div'); card.className='card mo';
  let cells='', sumN=0, sumD=0, full=0, past=0;
  for(let i=0;i<rows*7;i++){ const d=addDays(start,i), ds=ymd(d), out=d.getMonth()!==m, s=dayStat(d), hasEv=S.items.some(it=>it.kind==='once'&&it.date===ds);
    if(!out&&d<=t&&s.n){ sumN+=s.n; sumD+=s.dn; past++; if(s.dn===s.n) full++; }
    cells+=`<div class="c ${out?'out':''} ${ds===ts?'today':''} ${ds===sel?'sel':''}" data-ds="${ds}"><div class="n">${d.getDate()}</div>${hasEv?'<i class="ev"></i>':''}${(d<=t&&s.n)?`<div class="ring ${s.dn===s.n?'full':''}" style="--p:${s.p}%"><i>${s.dn===s.n?'✓':s.dn}</i></div>`:''}</div>`; }
  card.innerHTML=`<div class="head">${DAYS.map(d=>`<div>${d}</div>`).join('')}</div><div class="cells">${cells}</div><div class="foot"><span>이달 달성률 <b>${sumN?Math.round(sumD/sumN*100):0}%</b></span><span>전부 완료한 날 <b>${full}</b> / ${past}</span><span>체크 <b>${sumD}</b> / ${sumN}</span></div>`;
  root.appendChild(card);
  card.querySelectorAll('.c').forEach(el=>el.onclick=()=>{ sel=el.dataset.ds; cur=parse(sel); view='today'; try{ localStorage.setItem('sv_schedule_view2',view); }catch(_){} render(); });
}

  const grp=[['매일',S.items.filter(i=>i.kind==='daily')],['매주',S.items.filter(i=>i.kind==='weekly')],['매월',S.items.filter(i=>i.kind==='monthly')],['일정 (한 번)',S.items.filter(i=>i.kind==='once').sort((a,b)=>b.date.localeCompare(a.date))]];

/* ───────── 만다라트 (오타니 쇼헤이 식 9×9: 가운데 핵심 목표 · 8개 세부 목표 · 각 8개 실천) ─────────
   S.mandala = { goal, subs:[{title, cells:[{text, ref}×8]}×8] }  ref = 연결된 루틴 id (칸을 누르면 오늘 체크) */
const POS=[0,1,2,3,5,6,7,8];
const PASTEL=[['#fde2e2','#b42318'],['#ffe8cc','#b54708'],['#fff3c4','#8a6a00'],['#dcf5dc','#1f7a3a'],['#d3f1f7','#0b6f85'],['#dde6ff','#2f4fd6'],['#eadcff','#6b35c9'],['#ffdcef','#b4237a']]; // 세부 목표별 파스텔 [배경, 글자]
const pst=i=>`--pb:${PASTEL[i%8][0]};--pi:${PASTEL[i%8][1]}`; // 3×3 에서 가운데(4)를 뺀 8칸, 세부목표 i 의 블록 위치 = POS[i]
let mFocus=null, mEdit=false;
function mandala(){ if(!S.mandala||!Array.isArray(S.mandala.subs)||S.mandala.subs.length!==8) S.mandala={goal:'',subs:[...Array(8)].map(()=>({title:'',cells:[...Array(8)].map(()=>({text:'',ref:null}))}))}; S.mandala.subs.forEach(b=>{ if(!Array.isArray(b.cells)||b.cells.length!==8) b.cells=[...Array(8)].map(()=>({text:'',ref:null})); }); return S.mandala; }
function refItem(id){ return id?S.items.find(i=>i.id===id):null; }
function cellHtml(c,si,ci,d){
  const it=refItem(c.ref), ds=ymd(d);
  if(it){ const on=doneEff(it,d), chk=isDone(it.id,ds); let k='';
    if(isFlex(it)) k=`${flexCount(it,d)}/${times(it)} ${it.kind==='weekly'?'주':'월'}`; else { const st=streak(it); k=st>1?`${st}일째`:kindLabel(it); }
    return `<div class="mc ref ${on?'on':''}" data-s="${si}" data-c="${ci}" style="--c:${it.color}" title="${esc(it.title)} — 누르면 오늘 체크"><span class="t">${esc(c.text||it.title)}</span><span class="k">${k}</span>${chk?'<span class="chk">✓</span>':''}</div>`; }
  return `<div class="mc ${c.text?'':'empty'}" data-s="${si}" data-c="${ci}"><span class="t">${esc(c.text||'＋')}</span></div>`; }
function blockHtml(si,d){ const M=mandala(), b=M.subs[si]; let h='';
  for(let p=0;p<9;p++){ if(p===4){ h+=`<div class="mc sub ${b.title?'':'empty'}" data-s="${si}" data-c="-1"><span class="t">${esc(b.title||`세부 목표 ${si+1}`)}</span></div>`; continue; } const ci=POS.indexOf(p); h+=cellHtml(b.cells[ci],si,ci,d); }
  return `<div class="m3" data-b="${si}" style="${pst(si)}">${h}</div>`; }
function hubHtml(){ const M=mandala(); let h='';
  for(let p=0;p<9;p++){ if(p===4){ h+=`<div class="mc goal ${M.goal?'':'empty'}" data-s="-1" data-c="-1"><span class="t">${esc(M.goal||'핵심 목표')}</span></div>`; continue; } const si=POS.indexOf(p), b=M.subs[si];
    const refs=b.cells.filter(c=>refItem(c.ref)), on=refs.filter(c=>doneEff(refItem(c.ref),cur)).length;
    h+=`<div class="mc sub ${b.title?'':'empty'}" data-s="${si}" data-c="-1" data-hub="1" style="${pst(si)}"><span class="t">${esc(b.title||`세부 목표 ${si+1}`)}</span>${refs.length?`<span class="k">${on}/${refs.length}</span>`:''}</div>`; }
  return `<div class="m3 hub">${h}</div>`; }
function renderMandala(root){
  const M=mandala(), d=cur, narrow=window.innerWidth<=640;
  dateHead(root,'만다라트',`${d.getMonth()+1}.${d.getDate()} 기준`,dir=>{ cur=addDays(cur,dir); sel=ymd(cur); render(); });
  const card=document.createElement('div'); card.className='card mdl'+((mFocus!==null||narrow)?' zoom':'');
  const refs=M.subs.flatMap(b=>b.cells).filter(c=>refItem(c.ref)), on=refs.filter(c=>doneEff(refItem(c.ref),d)).length;
  let h=`<div class="tools"><button class="ib ${mEdit?'on':''}" id="mEdit">✎ 편집 모드${mEdit?' 켜짐':''}</button>${mFocus!==null?'<button class="ib" id="mBack">← 전체</button>':''}<span class="sp"></span><button class="ib" id="mFill" title="루틴이 연결 안 된 세부 목표 블록의 빈 칸에 기존 루틴을 채웁니다">루틴으로 채우기</button></div>`;
  if(mFocus!==null) h+=blockHtml(mFocus,d);
  else if(narrow) h+=hubHtml();
  else { h+='<div class="m9">'; for(let p=0;p<9;p++) h+=(p===4?hubHtml():blockHtml(POS.indexOf(p),d)); h+='</div>'; }
  h+=`<div class="foot"><span>연결된 루틴 <b>${on}</b> / ${refs.length} 완료</span><span>${mEdit?'편집 모드: 칸을 누르면 내용·연결 수정':'칸을 누르면 오늘 체크 · 빈 칸은 바로 입력 · 꾹 눌러 끌면 자리 이동(세부 목표끼리 끌면 블록 통째로 교환)'}${narrow&&mFocus===null?' · 세부 목표를 누르면 그 블록으로':''}</span></div>`;
  card.innerHTML=h; root.appendChild(card);
  $('#mEdit').onclick=()=>{ mEdit=!mEdit; render(); };
  if($('#mBack')) $('#mBack').onclick=()=>{ mFocus=null; render(); };
  $('#mFill').onclick=()=>{ const used=new Set(M.subs.flatMap(b=>b.cells.map(c=>c.ref)).filter(Boolean)); const pool=S.items.filter(i=>i.kind!=='once'&&!used.has(i.id)); if(!pool.length){ toast('연결 안 된 루틴이 없습니다'); return; }
    let n=0; M.subs.forEach(b=>{ b.cells.forEach(c=>{ if(!c.ref&&!c.text&&pool.length){ const it=pool.shift(); c.ref=it.id; n++; } }); }); save(); render(); toast(`루틴 ${n}개를 빈 칸에 넣었습니다 — 편집 모드에서 자리를 바꾸세요`); };
  bindDrag(card);
  card.querySelectorAll('.mc').forEach(el=>el.onclick=()=>{ if(dragDone){ dragDone=false; return; } const si=+el.dataset.s, ci=+el.dataset.c;
    if(si===-1){ openCell(-1,-1); return; }
    if(ci===-1){ if(el.dataset.hub&&narrow&&mFocus===null&&!mEdit){ mFocus=si; render(); } else openCell(si,-1); return; }
    const c=M.subs[si].cells[ci], it=refItem(c.ref);
    if(!mEdit&&it){ toggle(it.id,ymd(d)); return; }
    openCell(si,ci); });
}
/* 드래그로 자리 바꾸기 — 실천 칸끼리 교환, 세부 목표 칸끼리 블록 통째 교환. 마우스: 끌기 / 터치: 꾹 누른 뒤 끌기 */
let dragDone=false, DG=null;
document.addEventListener('touchmove',e=>{ if(DG&&DG.on) e.preventDefault(); },{passive:false});
function bindDrag(card){
  card.querySelectorAll('.mc').forEach(el=>{ const si=+el.dataset.s, ci=+el.dataset.c; if(si===-1) return;
    el.addEventListener('pointerdown',e=>{ if(e.button&&e.button!==0) return; const touch=e.pointerType!=='mouse';
      DG={el,si,ci,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,timer:null};
      if(touch) DG.timer=setTimeout(()=>startDrag(e),380); });
    el.addEventListener('contextmenu',e=>{ if(DG) e.preventDefault(); });
  });
  function startDrag(e){ if(!DG||DG.on) return; DG.on=true; try{ DG.el.setPointerCapture(DG.id); }catch(_){}
    DG.el.classList.add('dragsrc'); const g=document.createElement('div'); g.className='mghost'; g.textContent=DG.el.querySelector('.t')?.textContent||''; document.body.appendChild(g); DG.ghost=g; moveGhost(e.clientX,e.clientY);
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){} }
  function moveGhost(x,y){ if(!DG.ghost) return; DG.ghost.style.left=x+'px'; DG.ghost.style.top=y+'px';
    const t=targetAt(x,y,DG); card.querySelectorAll('.mc.dropok').forEach(o=>{ if(o!==t) o.classList.remove('dropok'); }); if(t) t.classList.add('dropok'); }
  function targetAt(x,y,d){ const under=document.elementFromPoint(x,y); const t=under&&under.closest('.mc'); if(!t||t===d.el||!card.contains(t)) return null;
    const ts=+t.dataset.s, tc=+t.dataset.c; if(ts===-1) return null; if((d.ci===-1)!==(tc===-1)) return null; return t; }
  function end(e,cancel){ if(!DG) return; clearTimeout(DG.timer); const d=DG; DG=null;
    if(!d.on) return; d.el.classList.remove('dragsrc'); if(d.ghost) d.ghost.remove(); card.querySelectorAll('.mc.dropok').forEach(o=>o.classList.remove('dropok')); dragDone=true; setTimeout(()=>dragDone=false,300);
    if(cancel) return; const t=targetAt(e.clientX,e.clientY,d); if(!t) return; const ts=+t.dataset.s, tc=+t.dataset.c, M=mandala();
    if(d.ci===-1){ const a=M.subs[d.si]; M.subs[d.si]=M.subs[ts]; M.subs[ts]=a; }
    else { const a=M.subs[d.si].cells[d.ci]; M.subs[d.si].cells[d.ci]=M.subs[ts].cells[tc]; M.subs[ts].cells[tc]=a; }
    save(); render(); toast(d.ci===-1?'세부 목표 블록을 교환했습니다':'자리를 바꿨습니다'); }
  card.addEventListener('pointermove',e=>{ if(!DG) return; if(!DG.on){ const dx=e.clientX-DG.x, dy=e.clientY-DG.y; if(Math.hypot(dx,dy)>8){ if(e.pointerType==='mouse') startDrag(e); else { clearTimeout(DG.timer); DG=null; } } return; } moveGhost(e.clientX,e.clientY); });
  card.addEventListener('pointerup',e=>end(e,false)); card.addEventListener('pointercancel',e=>end(e,true));
  document.addEventListener('pointerup',e=>{ if(DG&&!DG.on){ clearTimeout(DG.timer); DG=null; } },{once:false});
}
let mc=null;
function openCell(si,ci){
  const M=mandala(); mc={si,ci};
  const isGoal=si===-1, isSub=ci===-1&&!isGoal, c=isGoal?{text:M.goal}:isSub?{text:M.subs[si].title}:M.subs[si].cells[ci];
  $('#mvKind').textContent=isGoal?'핵심 목표':isSub?`세부 목표 ${si+1}`:`실천 ${si+1}-${ci+1}`;
  $('#mvText').value=c.text||''; $('#mvText').placeholder=isGoal?'예: 2027년까지 복리로 자산 ○○':isSub?'예: 독서 · 건강 · 투자 과정':'실천 내용 (루틴을 연결하면 비워도 됨)';
  $('#mvRefWrap').style.display=(isGoal||isSub)?'none':''; $('#mvNewWrap').style.display='none';
  if(!isGoal&&!isSub){ const rs=S.items.filter(i=>i.kind!=='once'); $('#mvRef').innerHTML=`<option value="">연결 안 함 (글만)</option><option value="__new">＋ 이 내용으로 새 루틴 만들기</option>`+rs.map(i=>`<option value="${i.id}" ${i.id===c.ref?'selected':''}>${esc(i.title)} · ${kindLabel(i)}</option>`).join(''); $('#mvRef').value=c.ref&&rs.some(i=>i.id===c.ref)?c.ref:''; }
  $('#mvClear').style.display=(c.text||c.ref)?'':'none';
  $('#mov').classList.add('on'); setTimeout(()=>{ const t=$('#mvText'); t.style.height='auto'; t.style.height=Math.min(160,t.scrollHeight)+'px'; t.focus(); },40);
}
$('#mvText').addEventListener('input',()=>{ const t=$('#mvText'); t.style.height='auto'; t.style.height=Math.min(160,t.scrollHeight)+'px'; });
$('#mvRef').onchange=()=>{ $('#mvNewWrap').style.display=$('#mvRef').value==='__new'?'':'none'; };
$('#mvNewKind').onclick=e=>{ const b=e.target.closest('button'); if(b) document.querySelectorAll('#mvNewKind button').forEach(x=>x.classList.toggle('on',x===b)); };
$('#mvCancel').onclick=()=>$('#mov').classList.remove('on');
$('#mov').onclick=e=>{ if(e.target===$('#mov')) $('#mov').classList.remove('on'); };
$('#mvClear').onclick=()=>{ const M=mandala(); if(mc.si===-1) M.goal=''; else if(mc.ci===-1) M.subs[mc.si].title=''; else M.subs[mc.si].cells[mc.ci]={text:'',ref:null}; save(); $('#mov').classList.remove('on'); render(); };
$('#mvSave').onclick=()=>{ const M=mandala(), t=$('#mvText').value.trim();
  if(mc.si===-1) M.goal=t; else if(mc.ci===-1) M.subs[mc.si].title=t;
  else { let ref=$('#mvRef').value; if(ref==='__new'){ if(!t){ toast('새 루틴 제목이 될 내용을 입력하세요'); return; } const k=($('#mvNewKind .on')||{}).dataset?.k||'daily'; const it={id:'s'+Date.now().toString(36),title:t,color:COLORS[(S.items.length)%COLORS.length],note:''};
      if(k==='daily'){ it.kind='daily'; it.days=[]; } else if(k==='w3'){ it.kind='weekly'; it.days=[]; it.times=3; } else if(k==='w5'){ it.kind='weekly'; it.days=[]; it.times=5; } else { it.kind='monthly'; it.doms=[]; it.times=1; }
      S.items.push(it); ref=it.id; }
    if(!t&&!ref){ toast('내용을 쓰거나 루틴을 연결하세요'); return; }
    M.subs[mc.si].cells[mc.ci]={text:t,ref:ref||null}; }
  save(); $('#mov').classList.remove('on'); render(); toast('저장됨 — 커밋 & 푸시로 동기화'); };

/* ───────── 편집 ───────── */
let ed=null;
function openEdit(id,preset){
  const it=id?S.items.find(i=>i.id===id):null;
  ed = it ? JSON.parse(JSON.stringify(it)) : Object.assign({id:'s'+Date.now().toString(36),title:'',kind:'daily',days:[],doms:[],date:sel||ymd(today()),slot:'any',times:1,color:COLORS[0],note:''},preset||{});
  if(!ed.slot) ed.slot=slotOf(ed); delete ed.start; delete ed.end; delete ed.allDay;
  ed._flex=isFlex(ed); if(ed.kind==='weekly'||ed.kind==='monthly'){ if(!ed._flex&&!ed.times) ed.times=1; }
  $('#fTitle').value=ed.title||''; $('#fDate').value=ed.date||sel; $('#fNote').value=ed.note||''; $('#fTimes').value=times(ed);
  $('#fDom').value=(ed.doms||[]).map(x=>x==='last'?'말일':x).join(', '); $('#fDel').style.display=it?'':'none';
  $('#fColor').innerHTML=COLORS.map(c=>`<button data-c="${c}" class="${c===ed.color?'on':''}" style="background:${c}"></button>`).join('');
  $('#fDays').innerHTML=DAYS.map((d,i)=>`<button data-d="${i}" class="${(ed.days||[]).includes(i)?'on':''}">${d}</button>`).join('');
  syncForm(); $('#ov').classList.add('on'); setTimeout(()=>$('#fTitle').focus(),40);
}
function syncForm(){
  document.querySelectorAll('#fKind button').forEach(b=>b.classList.toggle('on',b.dataset.k===ed.kind));
  document.querySelectorAll('#fSlot button').forEach(b=>b.classList.toggle('on',b.dataset.s===(ed.slot||'any')));
  const k=ed.kind, flexable=k==='weekly'||k==='monthly';
  $('#fDateWrap').style.display=k==='once'?'':'none';
  $('#fFlexWrap').style.display=flexable?'':'none';
  $('#fFlexLab').textContent=k==='weekly'?'요일 상관없이 — 주 N회만 채우면 됨':'날짜 상관없이 — 월 N회만 채우면 됨';
  $('#fFlex').classList.toggle('on',!!ed._flex);
  $('#fTimesWrap').style.display=(flexable&&ed._flex)?'':'none'; $('#fTimesLab').textContent=k==='weekly'?'회 / 주':'회 / 월';
  $('#fDaysWrap').style.display=(k==='daily'||(k==='weekly'&&!ed._flex))?'':'none';
  $('#fDaysWrap label').textContent=k==='daily'?'요일 (비우면 매일)':'요일';
  $('#fDomWrap').style.display=(k==='monthly'&&!ed._flex)?'':'none';
  $('#fSw').style.background=ed.color;
}
$('#fKind').onclick=e=>{ const b=e.target.closest('button'); if(b){ ed.kind=b.dataset.k; if(ed.kind==='weekly'&&!(ed.days||[]).length&&!ed._flex) ed._flex=true; if(ed.kind==='monthly'&&!(ed.doms||[]).length&&!ed._flex) ed._flex=true; syncForm(); } };
$('#fFlex').onclick=()=>{ ed._flex=!ed._flex; syncForm(); };
$('#fSlot').onclick=e=>{ const b=e.target.closest('button'); if(b){ ed.slot=b.dataset.s; syncForm(); } };
$('#fColor').onclick=e=>{ const b=e.target.closest('button'); if(b){ ed.color=b.dataset.c; document.querySelectorAll('#fColor button').forEach(x=>x.classList.toggle('on',x===b)); syncForm(); } };
$('#fDays').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const d=+b.dataset.d; ed.days=ed.days||[]; ed.days=ed.days.includes(d)?ed.days.filter(x=>x!==d):ed.days.concat(d).sort(); b.classList.toggle('on'); };
$('#fCancel').onclick=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{ if(e.target===$('#ov')) $('#ov').classList.remove('on'); };
$('#fDel').onclick=()=>{ S.items=S.items.filter(i=>i.id!==ed.id); Object.values(S.done).forEach(o=>delete o[ed.id]); save(); $('#ov').classList.remove('on'); render(); toast('삭제됨'); };
$('#fSave').onclick=()=>{
  ed.title=$('#fTitle').value.trim(); if(!ed.title){ toast('제목을 입력하세요'); $('#fTitle').focus(); return; }
  ed.note=$('#fNote').value.trim(); if(ed.slot==='any') delete ed.slot;
  if(ed.kind==='once'){ ed.date=$('#fDate').value; if(!ed.date){ toast('날짜를 고르세요'); return; } } else delete ed.date;
  if(ed.kind==='weekly'){ if(ed._flex){ ed.days=[]; ed.times=Math.max(1,parseInt($('#fTimes').value,10)||1); } else { delete ed.times; if(!(ed.days||[]).length){ toast('요일을 고르거나 "요일 상관없이"를 켜세요'); return; } } }
  if(ed.kind==='monthly'){ if(ed._flex){ ed.doms=[]; ed.times=Math.max(1,parseInt($('#fTimes').value,10)||1); } else { delete ed.times; ed.doms=$('#fDom').value.split(/[,\s]+/).filter(Boolean).map(x=>/말일|last/i.test(x)?'last':parseInt(x,10)).filter(x=>x==='last'||(x>=1&&x<=31)); if(!ed.doms.length){ toast('날짜를 입력하거나 "날짜 상관없이"를 켜세요'); return; } } } else if(ed.kind!=='weekly') ed.doms=[];
  if(ed.kind!=='daily'&&ed.kind!=='weekly') ed.days=[];
  if(ed.kind==='daily'||ed.kind==='once') delete ed.times;
  delete ed._flex;
  const i=S.items.findIndex(x=>x.id===ed.id); if(i>=0) S.items[i]=ed; else S.items.push(ed);
  save(); $('#ov').classList.remove('on'); render(); toast('저장됨 — 커밋 & 푸시로 동기화');
};
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#ov').classList.remove('on'); $('#mov').classList.remove('on'); } if($('#mov').classList.contains('on')&&e.key==='Enter'&&(e.metaKey||e.ctrlKey||(e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='SELECT'))){ e.preventDefault(); $('#mvSave').click(); return; } if($('#ov').classList.contains('on')&&e.key==='Enter'&&e.target.tagName!=='TEXTAREA') $('#fSave').click(); });

/* ───────── 네비 ───────── */
$('#views').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; view=b.dataset.v; try{ localStorage.setItem('sv_schedule_view2',view); }catch(_){} render(); };
$('#todayBtn').onclick=()=>{ cur=today(); sel=ymd(cur); if(view!=='today'&&view!=='week'&&view!=='month') view='today'; render(); };
$('#add').onclick=()=>openEdit(null,{kind:'daily'});
let _tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('on'),2000); }
render(); pull();
</script>
